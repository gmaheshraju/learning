  <style>
    .st-wrap { max-width: 760px; margin: 0 auto; }

    .st-picker {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 42vw), 1fr));
      gap: clamp(10px, 1.8vmin, 18px); padding: 4px 0;
    }
    .st-pick-card {
      -webkit-appearance: none; appearance: none;
      background: var(--surface); border: 3px solid transparent;
      border-radius: clamp(22px, 3vmin, 30px);
      padding: clamp(14px, 2.6vmin, 26px) 10px;
      text-align: center; cursor: pointer;
      transition: transform .18s var(--spring), border-color .2s;
      animation: bounceIn .45s var(--spring) both;
      box-shadow: var(--shadow-sm), inset 0 -5px 0 rgba(47,34,53,.06);
    }
    .st-pick-card:active { transform: scale(.95); }
    .st-pick-emoji { font-family: var(--emoji); font-size: clamp(40px, 8vmin, 72px); line-height: 1.2; }
    .st-pick-title { font-family: var(--display); font-size: clamp(16px, 2.2vmin, 22px); font-weight: 600; color: var(--ink); margin-top: 6px; line-height: 1.25; }
    .st-pick-telugu { font-size: clamp(13px, 1.8vmin, 17px); font-weight: 600; color: var(--textL); margin-top: 3px; }

    .st-title-bar { text-align: center; padding: 2px 10px 0; }
    .st-title-text { font-family: var(--display); font-size: clamp(20px, 3.3vmin, 34px); font-weight: 600; }
    .st-title-telugu { font-size: clamp(14px, 2.2vmin, 20px); font-weight: 600; color: var(--textL); margin-top: 2px; }

    .st-dots { display: flex; justify-content: center; gap: 2px; padding: 4px 0; }
    .st-dot {
      width: 32px; height: 32px; border: none; background: none; padding: 0; cursor: pointer;
      display: grid; place-items: center;
    }
    .st-dot::before {
      content: ''; width: clamp(10px, 1.8vmin, 14px); height: clamp(10px, 1.8vmin, 14px);
      border-radius: 50%; background: var(--line); transition: background .3s, transform .3s;
    }
    .st-dot.done::before { background: var(--good); }
    .st-dot.current::before { background: var(--accent); transform: scale(1.35); }

    .st-book {
      background: var(--surface);
      border-radius: clamp(24px, 3.8vmin, 36px);
      box-shadow: var(--shadow-md);
      overflow: hidden; position: relative;
      touch-action: pan-y pinch-zoom;
    }
    .st-page {
      padding: clamp(18px, 4vmin, 40px) clamp(14px, 3vmin, 32px);
      text-align: center; animation: fadeIn .4s ease-out;
      min-height: min(clamp(320px, 56vmin, 520px), 62dvh);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .st-scene {
      font-family: var(--emoji); font-size: clamp(54px, min(15vw, 13vmin), 120px);
      line-height: 1.25; margin-bottom: 16px; letter-spacing: 4px;
      animation: bounceIn .5s ease-out;
    }
    .st-text {
      font-family: var(--display); font-size: clamp(22px, 3.8vmin, 38px); font-weight: 500; color: var(--ink);
      line-height: 1.5; max-width: 26ch; margin: 0 auto;
    }
    .st-word { border-radius: 6px; padding: 0 2px; transition: color .15s, background-color .15s; }
    .st-word.st-active { color: var(--p0ink); background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .st-page-num { font-size: clamp(12px, 1.8vmin, 15px); color: var(--textL); font-weight: 800; margin-top: 14px; }

    .st-controls { display: flex; justify-content: center; align-items: center; gap: clamp(8px, 2vmin, 16px); padding: 14px 0 4px; }
    .st-controls .btn { font-size: clamp(15px, 2vmin, 21px); padding: 10px clamp(16px, 3vmin, 32px); }


    .st-stars-c { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }

    @media (hover: hover) and (pointer: fine) {
      .st-pick-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    }
    @media (max-width: 400px) {
      .st-controls .btn { padding: 10px 14px; }
    }
    /* Phones held sideways: pictures beside the words */
    @media (orientation: landscape) and (max-height: 520px) {
      .st-wrap { max-width: 900px; }
      .st-title-telugu { display: none; }
      .st-page { flex-direction: row; gap: 24px; min-height: 0; padding: 14px 24px; }
      .st-scene { margin: 0; font-size: clamp(48px, 15vh, 80px); max-width: 45%; }
      .st-text { text-align: left; }
      .st-page-num { display: none; }
      .st-controls { padding-top: 8px; }
    }
  </style>
</head>

    var RATE = 0.65;
    var area = document.getElementById('st-area');
    var stars = document.getElementById('st-stars');
    var currentStory = null;
    var currentPage = 0;
    var reading = false;
    var lastTurn = 0;
    var hl = { timers: [], boundary: false };

    function speak(text, rate, onEnd, opts) { Speech.speak(text, rate || 0.8, onEnd, opts); }

    /* ---------- read-along highlighting ----------
       Follows the voice's word boundaries where the engine reports them;
       otherwise steps through the words at an estimated reading pace. */
    function wordEls() { return area.querySelectorAll('.st-word'); }

    function highlight(i) {
      var els = wordEls();
      for (var k = 0; k < els.length; k++) els[k].classList.toggle('st-active', k === i);
    }

    function stopHighlight() {
      hl.timers.forEach(clearTimeout);
      hl.timers = [];
      highlight(-1);
    }

    function pacedHighlight(text) {
      hl.timers.forEach(clearTimeout);
      hl.timers = [];
      var words = text.split(' ');
      var total = Math.max(800, Speech.estimateMs(text, RATE) - 400);
      var weights = words.map(function (w) { return w.length + 2; });
      var sum = weights.reduce(function (a, b) { return a + b; }, 0);
      var t = 0;
      words.forEach(function (w, i) {
        hl.timers.push(setTimeout(function () { if (!hl.boundary) highlight(i); }, t));
        t += total * weights[i] / sum;
      });
    }

    function readPage() {
      var page = currentStory.pages[currentPage];
      var text = page.text;
      var starts = [];
      var pos = 0;
      text.split(' ').forEach(function (w) { starts.push(pos); pos += w.length + 1; });

      stopHighlight();
      hl.boundary = false;
      setReading(true);
      // if the voice never starts (muted, blocked), still read along with the eyes
      hl.timers.push(setTimeout(function () { pacedHighlight(text); }, 900));

      speak(text, RATE, function () {
        stopHighlight();
        setReading(false);
      }, {
        onStart: function () {
          hl.timers.forEach(clearTimeout);
          hl.timers = [setTimeout(function () { if (!hl.boundary) pacedHighlight(text); }, 600)];
          highlight(0);
        },
        onBoundary: function (e) {
          if (e.name && e.name !== 'word') return;
          if (!hl.boundary) { hl.boundary = true; hl.timers.forEach(clearTimeout); hl.timers = []; }
          var i = 0;
          while (i + 1 < starts.length && starts[i + 1] <= e.charIndex) i++;
          highlight(i);
        }
      });
    }

    function stopReading() {
      Speech.stop();
      stopHighlight();
      setReading(false);
    }

    function setReading(on) {
      reading = on;
      var btn = document.getElementById('st-read');
      if (!btn) return;
      btn.innerHTML = on ? App.icon('stop') + 'Stop' : App.icon('volume') + 'Read';
      btn.setAttribute('aria-pressed', String(on));
    }

    /* ---------- screens ---------- */
    function showPicker() {
      stopReading();
      currentStory = null;
      area.innerHTML = '<h2 class="st-heading">Pick a story!</h2>';
      var grid = document.createElement('div');
      grid.className = 'st-picker';
      STORIES.forEach(function (story, i) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'st-pick-card';
        card.style.animationDelay = (i * 0.05) + 's';
        card.style.borderColor = story.color;
        card.innerHTML =
          '<div class="st-pick-emoji" aria-hidden="true">' + story.emoji + '</div>' +
          '<div class="st-pick-title">' + story.title + '</div>' +
          '<div class="st-pick-telugu" lang="te">' + story.telugu + '</div>';
        card.addEventListener('click', function () {
          currentStory = story;
          currentPage = 0;
          showPage(true);
        });
        grid.appendChild(card);
      });
      area.appendChild(grid);
    }

    // autoRead: narrate when moving forward; Back and the page dots stay quiet.
    function showPage(autoRead) {
      stopReading();
      var story = currentStory;
      var page = story.pages[currentPage];
      area.innerHTML = '';

      var titleBar = document.createElement('div');
      titleBar.className = 'st-title-bar';
      titleBar.innerHTML =
        '<div class="st-title-text" style="color:' + story.color + '">' + story.title + '</div>' +
        '<div class="st-title-telugu" lang="te">' + story.telugu + '</div>';
      area.appendChild(titleBar);

      var dots = document.createElement('div');
      dots.className = 'st-dots';
      story.pages.forEach(function (_, d) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'st-dot' + (d < currentPage ? ' done' : '') + (d === currentPage ? ' current' : '');
        dot.setAttribute('aria-label', 'Page ' + (d + 1));
        if (d === currentPage) dot.setAttribute('aria-current', 'page');
        dot.addEventListener('click', function () { currentPage = d; showPage(false); });
        dots.appendChild(dot);
      });
      area.appendChild(dots);

      var book = document.createElement('div');
      book.className = 'st-book';
      book.innerHTML =
        '<div class="st-page"><div class="st-scene" aria-hidden="true"></div>' +
        '<p class="st-text"></p><div class="st-page-num"></div></div>';
      book.querySelector('.st-scene').textContent = page.scene;
      var textEl = book.querySelector('.st-text');
      page.text.split(' ').forEach(function (w, i, all) {
        var span = document.createElement('span');
        span.className = 'st-word';
        span.textContent = w;
        textEl.appendChild(span);
        if (i < all.length - 1) textEl.appendChild(document.createTextNode(' '));
      });
      book.querySelector('.st-page-num').textContent = (currentPage + 1) + ' / ' + story.pages.length;
      area.appendChild(book);
      App.onSwipe(book, { left: goNext, right: goBack });

      var controls = document.createElement('div');
      controls.className = 'st-controls';
      controls.innerHTML =
        '<button type="button" class="btn ghost" id="st-back">' + App.icon('back') + 'Back</button>' +
        '<button type="button" class="btn" id="st-read" aria-pressed="false" style="--b:' + story.color + '"></button>' +
        '<button type="button" class="btn" id="st-next" style="--b:#2FBF71">Next' + App.icon('next') + '</button>';
      area.appendChild(controls);
      document.getElementById('st-back').disabled = currentPage === 0;
      document.getElementById('st-back').addEventListener('click', goBack);
      document.getElementById('st-next').addEventListener('click', goNext);
      document.getElementById('st-read').addEventListener('click', function () {
        if (reading) stopReading(); else readPage();
      });
      setReading(false);

      if (autoRead) readPage();
    }

    // A toddler hammering the big button shouldn't skip pages.
    function turnAllowed() {
      var now = Date.now();
      if (now - lastTurn < 450) return false;
      lastTurn = now;
      return true;
    }

    function goBack() {
      if (!currentStory || currentPage === 0 || !turnAllowed()) return;
      currentPage--;
      showPage(false);
    }

    function goNext() {
      if (!currentStory || !turnAllowed()) return;
      if (currentPage < currentStory.pages.length - 1) {
        currentPage++;
        showPage(true);
      } else {
        showEnd();
      }
    }

    function showEnd() {
      stopReading();
      App.roundResult('great');
      // something to wonder about together; the Parents area shows it too
      try { localStorage.setItem('heshvi-last-story', JSON.stringify({ title: currentStory.title, ask: currentStory.ask, at: Date.now() })); } catch (e) { /* private mode */ }
      App.celebrate({
        title: 'The End!', say: 'The End! What a wonderful story!', ask: currentStory.ask, stars: 3,
        text: currentStory.ask,
        buttons: [
          { label: 'More stories', icon: 'book', onClick: showPicker },
          { label: 'Read again', icon: 'again', ghost: true, onClick: function () { currentPage = 0; showPage(true); } }
        ]
      });
    }

    document.addEventListener('keydown', function (e) {
      if (!currentStory || !document.getElementById('st-next') || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goBack();
    });

    showPicker();
  </script>
</body>
</html>
