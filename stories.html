<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stories — Heshvitha's Learning World</title>
  <meta name="description" content="Playful learning for little ones: match, listen, discover, trace and read along, with Telugu hints.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFBF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1A2A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=14">
  <style>
    .st-wrap { max-width: 760px; margin: 0 auto; }
    .st-heading { text-align: center; font-size: clamp(18px, 2.6vmin, 30px); font-weight: 900; margin: 4px 0 12px; color: var(--textM); }

    .st-picker {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 42vw), 1fr));
      gap: clamp(10px, 1.8vmin, 18px); padding: 4px 0;
    }
    .st-pick-card {
      -webkit-appearance: none; appearance: none;
      background: var(--card); border: 3px solid var(--line);
      border-radius: clamp(16px, 2.6vmin, 26px);
      padding: clamp(14px, 2.6vmin, 26px) 10px;
      text-align: center; cursor: pointer;
      transition: transform .15s, border-color .2s;
      animation: bounceIn .4s ease-out both;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .st-pick-card:active { transform: scale(.95); }
    .st-pick-emoji { font-family: var(--emoji); font-size: clamp(40px, 8vmin, 72px); line-height: 1.2; }
    .st-pick-title { font-size: clamp(15px, 2.1vmin, 21px); font-weight: 900; color: var(--text); margin-top: 6px; line-height: 1.3; }
    .st-pick-telugu { font-size: clamp(13px, 1.8vmin, 17px); font-weight: 600; color: var(--textL); margin-top: 3px; }

    .st-title-bar { text-align: center; padding: 2px 10px 0; }
    .st-title-text { font-size: clamp(19px, 3.2vmin, 32px); font-weight: 900; }
    .st-title-telugu { font-size: clamp(14px, 2.2vmin, 20px); font-weight: 600; color: var(--textL); margin-top: 2px; }

    .st-dots { display: flex; justify-content: center; gap: 2px; padding: 4px 0; }
    .st-dot {
      width: 32px; height: 32px; border: none; background: none; padding: 0; cursor: pointer;
      display: grid; place-items: center;
    }
    .st-dot::before {
      content: ''; width: clamp(10px, 1.8vmin, 14px); height: clamp(10px, 1.8vmin, 14px);
      border-radius: 50%; background: var(--line); transition: background .3s, transform .3s;
    }
    .st-dot.done::before { background: #7EC850; }
    .st-dot.current::before { background: #F5A623; transform: scale(1.35); }

    .st-book {
      background: var(--card);
      border-radius: clamp(20px, 3.6vmin, 34px);
      border: 3px solid var(--line);
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      overflow: hidden; position: relative;
      touch-action: pan-y pinch-zoom;
    }
    .st-page {
      padding: clamp(18px, 4vmin, 40px) clamp(14px, 3vmin, 32px);
      text-align: center; animation: fadeIn .4s ease-out;
      min-height: min(clamp(320px, 56vmin, 520px), 62dvh);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .st-scene {
      font-family: var(--emoji); font-size: clamp(54px, min(15vw, 13vmin), 120px);
      line-height: 1.25; margin-bottom: 16px; letter-spacing: 4px;
      animation: bounceIn .5s ease-out;
    }
    .st-text {
      font-size: clamp(20px, 3.6vmin, 36px); font-weight: 800; color: var(--text);
      line-height: 1.6; max-width: 26ch; margin: 0 auto;
    }
    .st-word { border-radius: 6px; padding: 0 2px; transition: color .15s, background-color .15s; }
    .st-word.st-active { color: var(--p0ink); background: rgba(232,93,117,.14); }
    .st-page-num { font-size: clamp(12px, 1.8vmin, 15px); color: var(--textL); font-weight: 800; margin-top: 14px; }

    .st-controls { display: flex; justify-content: center; align-items: center; gap: clamp(8px, 2vmin, 16px); padding: 14px 0 4px; }
    .st-controls .btn { font-size: clamp(15px, 2vmin, 21px); padding: 10px clamp(16px, 3vmin, 32px); }

    .st-end { text-align: center; padding: 24px 16px; animation: bounceIn .5s ease-out; }
    .st-end .st-big { font-family: var(--emoji); font-size: clamp(60px, 14vmin, 120px); display: block; animation: float 2s ease-in-out infinite; }
    .st-end h2 { font-size: clamp(26px, 5vmin, 48px); font-weight: 900; animation: rainbow 2.5s linear infinite; margin: 8px 0; }
    .st-end p { font-size: clamp(15px, 2.6vmin, 24px); color: var(--textL); font-weight: 700; margin-bottom: 18px; }

    .st-stars-c { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }

    @media (hover: hover) and (pointer: fine) {
      .st-pick-card:hover { transform: scale(1.04); border-color: #F5A623; }
    }
    @media (max-width: 400px) {
      .st-controls .btn { padding: 10px 14px; }
    }
    /* Phones held sideways: pictures beside the words */
    @media (orientation: landscape) and (max-height: 520px) {
      .st-wrap { max-width: 900px; }
      .st-title-telugu { display: none; }
      .st-page { flex-direction: row; gap: 24px; min-height: 0; padding: 14px 24px; }
      .st-scene { margin: 0; font-size: clamp(48px, 15vh, 80px); max-width: 45%; }
      .st-text { text-align: left; }
      .st-page-num { display: none; }
      .st-controls { padding-top: 8px; }
    }
  </style>
</head>
<body>

    </header>
    <nav class="nav-links" aria-label="Activities">

    <div class="st-stars-c" id="st-stars" aria-hidden="true"></div>
  </div>

  <script src="js/common.js?v=14"></script>
  <script>
    var STORIES = [
      {
        title: 'The Hungry Caterpillar',
        emoji: '🐛🦋',
        telugu: 'ఆకలి గొంగళి పురుగు',
        color: '#7EC850',
        pages: [
          { scene: '🌿🐛🍃', text: 'A tiny caterpillar was very hungry.' },
          { scene: '🐛🍎', text: 'He ate a big red apple. Yum yum!' },
          { scene: '🐛🍌🍊', text: 'Then he ate a banana and an orange.' },
          { scene: '🐛😴🌙', text: 'His tummy was so full! He went to sleep.' },
          { scene: '☀️🦋🌸', text: 'He woke up as a beautiful butterfly!' }
        ]
      },
      {
        title: 'The Lost Baby Duck',
        emoji: '🐥🦆',
        telugu: 'తప్పిపోయిన బాతు పిల్ల',
        color: '#F5A623',
        pages: [
          { scene: '🦆🐥🐥🐥', text: 'Mama Duck had three baby ducks.' },
          { scene: '🐥❓🌳', text: 'One baby duck got lost in the park!' },
          { scene: '🐥🐸', text: 'He asked the frog. "Have you seen my mama?"' },
          { scene: '🐥🐰', text: 'He asked the rabbit. "Have you seen my mama?"' },
          { scene: '🐥🦆💕', text: '"Mama!" The baby duck found his mama! Quack quack!' }
        ]
      },
      {
        title: 'The Little Star',
        emoji: '⭐🌙',
        telugu: 'చిన్న నక్షత్రం',
        color: '#B07CD8',
        pages: [
          { scene: '🌙⭐✨', text: 'A little star lived high up in the sky.' },
          { scene: '⭐😢🌑', text: 'One night, the star felt sad and dim.' },
          { scene: '⭐🎵🌙', text: 'The moon sang a song. "Twinkle twinkle little star!"' },
          { scene: '⭐😊✨', text: 'The star felt happy and started to glow!' },
          { scene: '🌙⭐🌟💫', text: 'Now the little star shines the brightest of all!' }
        ]
      },
      {
        title: 'The Sharing Bunny',
        emoji: '🐰🥕',
        telugu: 'పంచుకునే కుందేలు',
        color: '#E85D75',
        pages: [
          { scene: '🐰🥕🥕🥕', text: 'Bunny found three yummy carrots!' },
          { scene: '🐰🥕➡️🐿️', text: 'He gave one carrot to the squirrel.' },
          { scene: '🐰🥕➡️🐢', text: 'He gave one carrot to the turtle.' },
          { scene: '🐰🥕😊', text: 'Bunny had one carrot left for himself.' },
          { scene: '🐿️🐢🐰💕', text: 'Sharing made everyone happy! What a kind bunny!' }
        ]
      },
      {
        title: 'The Rainy Day',
        emoji: '🌧️☂️',
        telugu: 'వర్షపు రోజు',
        color: '#4DADEA',
        pages: [
          { scene: '☀️🏠👧', text: 'Anu wanted to go outside and play.' },
          { scene: '🌧️😟👧', text: 'Oh no! It started raining!' },
          { scene: '👧☂️🌧️', text: 'She took her umbrella and went splash splash!' },
          { scene: '👧💧🐸', text: 'She saw a happy frog jumping in puddles!' },
          { scene: '🌈😊👧', text: 'The rain stopped and a rainbow appeared! What a fun day!' }
        ]
      },
      {
        title: 'The Sleepy Bear',
        emoji: '🐻😴',
        telugu: 'నిద్రపోతున్న ఎలుగుబంటి',
        color: '#F5A623',
        pages: [
          { scene: '🐻🍂🌲', text: 'Bear was very sleepy. Winter was coming!' },
          { scene: '🐻🛏️', text: 'He made a cozy bed with soft leaves.' },
          { scene: '🐻😴💤', text: 'Bear closed his eyes. "Good night!" Zzz!' },
          { scene: '❄️⛄🌨️', text: 'Snow fell all around while Bear was sleeping.' },
          { scene: '🐻🌸🌷☀️', text: 'Bear woke up in spring! "Good morning, world!"' }
        ]
      },
      {
        title: 'Baby Elephant Bath',
        emoji: '🐘🚿',
        telugu: 'ఏనుగు పిల్ల స్నానం',
        color: '#4DADEA',
        pages: [
          { scene: '🐘👶🌞', text: 'Baby Elephant played in the mud all day!' },
          { scene: '🐘🤎💦', text: 'He was so dirty! Brown mud everywhere!' },
          { scene: '🐘💦🚿', text: 'Mama sprayed water with her trunk. Splash!' },
          { scene: '🐘🧼✨', text: 'Scrub scrub! Baby Elephant was getting clean!' },
          { scene: '🐘😊💙', text: 'Now Baby Elephant is shiny and clean! Time for dinner!' }
        ]
      },
      {
        title: 'The Magic Seed',
        emoji: '🌱🌻',
        telugu: 'మాయా విత్తనం',
        color: '#7EC850',
        pages: [
          { scene: '👧🌰', text: 'Anu planted a tiny seed in the ground.' },
          { scene: '🌰💧☀️', text: 'She gave it water and sunshine every day.' },
          { scene: '🌱😊', text: 'Look! A little green plant is growing!' },
          { scene: '🌿🌼', text: 'It grew bigger and bigger with pretty leaves!' },
          { scene: '🌻🦋👧😊', text: 'It became a big sunflower! Even butterflies came to visit!' }
        ]
      }
    ];

    var RATE = 0.65;
    var area = document.getElementById('st-area');
    var stars = document.getElementById('st-stars');
    var currentStory = null;
    var currentPage = 0;
    var reading = false;
    var lastTurn = 0;
    var hl = { timers: [], boundary: false };

    function speak(text, rate, onEnd, opts) { Speech.speak(text, rate || 0.8, onEnd, opts); }

    /* ---------- read-along highlighting ----------
       Follows the voice's word boundaries where the engine reports them;
       otherwise steps through the words at an estimated reading pace. */
    function wordEls() { return area.querySelectorAll('.st-word'); }

    function highlight(i) {
      var els = wordEls();
      for (var k = 0; k < els.length; k++) els[k].classList.toggle('st-active', k === i);
    }

    function stopHighlight() {
      hl.timers.forEach(clearTimeout);
      hl.timers = [];
      highlight(-1);
    }

    function pacedHighlight(text) {
      hl.timers.forEach(clearTimeout);
      hl.timers = [];
      var words = text.split(' ');
      var total = Math.max(800, Speech.estimateMs(text, RATE) - 400);
      var weights = words.map(function (w) { return w.length + 2; });
      var sum = weights.reduce(function (a, b) { return a + b; }, 0);
      var t = 0;
      words.forEach(function (w, i) {
        hl.timers.push(setTimeout(function () { if (!hl.boundary) highlight(i); }, t));
        t += total * weights[i] / sum;
      });
    }

    function readPage() {
      var page = currentStory.pages[currentPage];
      var text = page.text;
      var starts = [];
      var pos = 0;
      text.split(' ').forEach(function (w) { starts.push(pos); pos += w.length + 1; });

      stopHighlight();
      hl.boundary = false;
      setReading(true);
      // if the voice never starts (muted, blocked), still read along with the eyes
      hl.timers.push(setTimeout(function () { pacedHighlight(text); }, 900));

      speak(text, RATE, function () {
        stopHighlight();
        setReading(false);
      }, {
        onStart: function () {
          hl.timers.forEach(clearTimeout);
          hl.timers = [setTimeout(function () { if (!hl.boundary) pacedHighlight(text); }, 600)];
          highlight(0);
        },
        onBoundary: function (e) {
          if (e.name && e.name !== 'word') return;
          if (!hl.boundary) { hl.boundary = true; hl.timers.forEach(clearTimeout); hl.timers = []; }
          var i = 0;
          while (i + 1 < starts.length && starts[i + 1] <= e.charIndex) i++;
          highlight(i);
        }
      });
    }

    function stopReading() {
      Speech.stop();
      stopHighlight();
      setReading(false);
    }

    function setReading(on) {
      reading = on;
      var btn = document.getElementById('st-read');
      if (!btn) return;
      btn.innerHTML = on ? '<span class="emoji">⏹</span> Stop' : '<span class="emoji">🔊</span> Read';
      btn.setAttribute('aria-pressed', String(on));
    }

    /* ---------- screens ---------- */
    function showPicker() {
      stopReading();
      currentStory = null;
      area.innerHTML = '<h2 class="st-heading">Pick a story!</h2>';
      var grid = document.createElement('div');
      grid.className = 'st-picker';
      STORIES.forEach(function (story, i) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'st-pick-card';
        card.style.animationDelay = (i * 0.05) + 's';
        card.style.borderColor = story.color;
        card.innerHTML =
          '<div class="st-pick-emoji" aria-hidden="true">' + story.emoji + '</div>' +
          '<div class="st-pick-title">' + story.title + '</div>' +
          '<div class="st-pick-telugu" lang="te">' + story.telugu + '</div>';
        card.addEventListener('click', function () {
          currentStory = story;
          currentPage = 0;
          showPage(true);
        });
        grid.appendChild(card);
      });
      area.appendChild(grid);
    }

    // autoRead: narrate when moving forward; Back and the page dots stay quiet.
    function showPage(autoRead) {
      stopReading();
      var story = currentStory;
      var page = story.pages[currentPage];
      area.innerHTML = '';

      var titleBar = document.createElement('div');
      titleBar.className = 'st-title-bar';
      titleBar.innerHTML =
        '<div class="st-title-text" style="color:' + story.color + '">' + story.title + '</div>' +
        '<div class="st-title-telugu" lang="te">' + story.telugu + '</div>';
      area.appendChild(titleBar);

      var dots = document.createElement('div');
      dots.className = 'st-dots';
      story.pages.forEach(function (_, d) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'st-dot' + (d < currentPage ? ' done' : '') + (d === currentPage ? ' current' : '');
        dot.setAttribute('aria-label', 'Page ' + (d + 1));
        if (d === currentPage) dot.setAttribute('aria-current', 'page');
        dot.addEventListener('click', function () { currentPage = d; showPage(false); });
        dots.appendChild(dot);
      });
      area.appendChild(dots);

      var book = document.createElement('div');
      book.className = 'st-book';
      book.innerHTML =
        '<div class="st-page"><div class="st-scene" aria-hidden="true"></div>' +
        '<p class="st-text"></p><div class="st-page-num"></div></div>';
      book.querySelector('.st-scene').textContent = page.scene;
      var textEl = book.querySelector('.st-text');
      page.text.split(' ').forEach(function (w, i, all) {
        var span = document.createElement('span');
        span.className = 'st-word';
        span.textContent = w;
        textEl.appendChild(span);
        if (i < all.length - 1) textEl.appendChild(document.createTextNode(' '));
      });
      book.querySelector('.st-page-num').textContent = (currentPage + 1) + ' / ' + story.pages.length;
      area.appendChild(book);
      App.onSwipe(book, { left: goNext, right: goBack });

      var controls = document.createElement('div');
      controls.className = 'st-controls';
      controls.innerHTML =
        '<button type="button" class="btn" id="st-back" style="background:#9A8587">⬅ Back</button>' +
        '<button type="button" class="btn" id="st-read" aria-pressed="false" style="background:' + story.color + '"></button>' +
        '<button type="button" class="btn" id="st-next" style="background:#5DB534">Next ➡</button>';
      area.appendChild(controls);
      document.getElementById('st-back').disabled = currentPage === 0;
      document.getElementById('st-back').addEventListener('click', goBack);
      document.getElementById('st-next').addEventListener('click', goNext);
      document.getElementById('st-read').addEventListener('click', function () {
        if (reading) stopReading(); else readPage();
      });
      setReading(false);

      if (autoRead) readPage();
    }

    // A toddler hammering the big button shouldn't skip pages.
    function turnAllowed() {
      var now = Date.now();
      if (now - lastTurn < 450) return false;
      lastTurn = now;
      return true;
    }

    function goBack() {
      if (!currentStory || currentPage === 0 || !turnAllowed()) return;
      currentPage--;
      showPage(false);
    }

    function goNext() {
      if (!currentStory || !turnAllowed()) return;
      if (currentPage < currentStory.pages.length - 1) {
        currentPage++;
        showPage(true);
      } else {
        showEnd();
      }
    }

    function showEnd() {
      stopReading();
      area.innerHTML =
        '<div class="st-end">' +
          '<span class="st-big" aria-hidden="true">📖</span>' +
          '<h2>The End!</h2>' +
          '<p>What a wonderful story!</p>' +
          '<div class="btn-stack">' +
            '<button type="button" class="btn" style="background:' + currentStory.color + '" id="st-again">Read Again <span class="emoji">🔄</span></button>' +
            '<button type="button" class="btn" style="background:#2F9BE0" id="st-new">More Stories <span class="emoji">📚</span></button>' +
          '</div>' +
        '</div>';
      for (var i = 0; i < 3; i++) {
        App.burst(stars, Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.5, 8);
      }
      speak('The End! What a wonderful story!', 0.8);
      document.getElementById('st-again').addEventListener('click', function () {
        currentPage = 0;
        showPage(true);
      });
      document.getElementById('st-new').addEventListener('click', showPicker);
    }

    document.addEventListener('keydown', function (e) {
      if (!currentStory || !document.getElementById('st-next') || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goBack();
    });

    showPicker();
  </script>
</body>
