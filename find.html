<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find It! · Heshvi</title>
  <meta name="description" content="Listen and tap the picture. Calm, playful learning for ages 2 to 7. No ads, no sign-up, works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15122A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load without blocking the first paint (a slow network must never mean a blank screen) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20">
  <style>
    .fi-wrap { max-width: 760px; margin: 0 auto; }
    .fi-wrap .prompt-row { animation: slideUp .4s ease-out; margin-top: 8px; }
    .fi-highlight { color: var(--accent); font-size: 1.2em; }

    .fi-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 2.2vmin, 22px);
      padding: 8px 2px;
      width: 100%; max-width: clamp(330px, 62vmin, 640px); margin: 0 auto;
    }
    .fi-card {
      -webkit-appearance: none; appearance: none;
      aspect-ratio: 1; min-width: 0;
      container-type: inline-size;
      background: var(--surface);
      border: clamp(3px, .6vmin, 6px) solid transparent;
      border-radius: clamp(20px, 3vmin, 32px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s var(--spring);
      user-select: none; -webkit-user-select: none;
      box-shadow: var(--shadow-sm), inset 0 -6px 0 rgba(47,34,53,.06);
      position: relative; overflow: hidden; padding: 0;
    }
    .fi-card:active { transform: scale(.93); }
    .fi-emoji { font-size: clamp(48px, 13vmin, 120px); font-size: 52cqi; transition: transform .3s; }
    .fi-label {
      font-family: var(--display); font-size: clamp(12px, 2.2vmin, 22px); font-size: 10cqi; font-weight: 600;
      margin-top: 4px; color: var(--ink-3);
      opacity: 0; transition: opacity .3s;
    }
    .fi-card.fi-correct { border-color: var(--good); background: var(--ok-bg); animation: celebrate .5s ease forwards; }
    .fi-card.fi-correct .fi-emoji { transform: scale(1.12); }
    .fi-card.fi-correct .fi-label { opacity: 1; color: var(--p3ink); }
    .fi-card.fi-wrong { animation: wiggle .45s ease; border-color: #FFB3C0; }
    .fi-card.fi-bounce { animation: bounceIn .4s var(--spring) both; }

    .fi-learn {
      text-align: center; padding: 12px 8px; animation: fadeIn .4s ease-out;
      max-width: 520px; margin: 0 auto;
    }
    .fi-learn-emoji { font-size: clamp(64px, 16vmin, 150px); line-height: 1; }
    .fi-known {
      display: inline-flex; align-items: center; gap: 6px; justify-self: start; margin: 0 auto 4px; padding: 5px 14px 5px 10px;
      border-radius: 999px; background: #FFF3C4; color: #8A5A00; font-weight: 900; font-size: 15px; animation: bounceIn .5s var(--spring) both;
    }
    .fi-known .ico { width: 18px; height: 18px; color: #F5A623; }
    .fi-learn-word { font-family: var(--display); font-size: clamp(36px, 8vmin, 76px); font-weight: 700; margin: 8px 0 2px; color: var(--accent); letter-spacing: 2px; word-break: break-word; }
    .fi-learn-phonics { font-size: clamp(16px, 3.2vmin, 28px); font-weight: 800; color: var(--p1ink); letter-spacing: 3px; margin-bottom: 4px; }
    .fi-learn-telugu { font-size: clamp(19px, 3.8vmin, 32px); font-weight: 700; color: var(--textL); margin-bottom: 10px; }
    .fi-learn-sentence {
      font-size: clamp(16px, 2.8vmin, 26px); font-weight: 700; color: var(--textM); line-height: 1.55;
      padding: 10px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); margin-bottom: 14px;
    }

    .fi-stars-c { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }

    .fi-progress { display: flex; justify-content: center; gap: 8px; padding: 4px 0; }
    .fi-dot { width: clamp(10px, 2vmin, 16px); height: clamp(10px, 2vmin, 16px); border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
    .fi-dot.done { background: var(--good); transform: scale(1.15); }
    .fi-dot.current { background: var(--accent); transform: scale(1.25); }

    /* Phones held sideways: four pictures in one row */
    @media (orientation: landscape) and (max-height: 520px) {
      .fi-grid { grid-template-columns: repeat(4, 1fr); max-width: min(680px, 100%); padding-top: 4px; }
      .fi-wrap .prompt-row { margin-top: 2px; }
      .fi-learn { display: grid; grid-template-columns: auto 1fr; column-gap: 20px; align-items: center; max-width: 760px; text-align: left; }
      .fi-learn-emoji { grid-row: span 6; font-size: clamp(90px, 34vh, 150px); }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="topbar" data-page="find"></header>

    <main class="fi-wrap" id="fi-area"></main>
    <div class="fi-stars-c" id="fi-stars" aria-hidden="true"></div>
  </div>

  <script src="js/common.js?v=20"></script>
  <script src="js/data.js?v=20"></script>
  <script src="js/telugu.js?v=20"></script>
  <script>
    const ROUNDS = 6;
    const CHOICES = 4;
    const CHEERS = [
      'Yes! Amazing!', 'You found it!', 'Great job!', 'Wow, so smart!',
      'Brilliant!', 'You got it!', 'Super!', 'Wonderful!'
    ];

    const area = document.getElementById('fi-area');
    const stars = document.getElementById('fi-stars');
    let currentCat = null;
    let round = 0;
    let target = null;
    let locked = false;
    let usedIds = new Set();
    let usedTargets = new Set();
    let misses = 0;
    let missedThis = false;   // a wrong tap on this question
    let newlyKnown = [];      // words that became "known" this game
    let step = 0;   // bumps on every screen change so stale timers/callbacks drop out

    function speak(text, rate, onEnd) { Speech.speak(text, rate || 0.8, onEnd); }
    function whereIs(it) { return 'Where ' + (it.many ? 'are' : 'is') + ' the '; }
    function askQuestion() { speak(whereIs(target) + target.name + '?', 0.75); }

    function resetGame() {
      round = 0;
      misses = 0;
      newlyKnown = [];
      usedIds.clear();
      usedTargets.clear();
    }

    function showCategoryPicker() {
      step++;
      Speech.stop();
      resetGame();
      area.innerHTML = '<h2 class="fi-title">Pick a topic!</h2>';

      const grid = document.createElement('div');
      grid.className = 'cat-grid';
      CATEGORIES.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cat-btn';
        btn.style.animationDelay = (i * 0.05) + 's';
        btn.innerHTML = '<span class="cat-emoji" aria-hidden="true">' + cat.emoji + '</span><span class="cat-name">' + cat.name + '</span>' + App.knownBadge(cat.items);
        btn.addEventListener('click', () => { currentCat = cat; resetGame(); startRound(); });
        grid.appendChild(btn);
      });
      area.appendChild(grid);
    }

    function pickItems() {
      const items = currentCat.items;
      // ask for words that are due or shaky more often, never the same one twice in a game
      const fresh = items.filter(it => !usedTargets.has(it.id));
      target = App.pickWords(fresh.length ? fresh : items, 1)[0];
      usedTargets.add(target.id);
      missedThis = false;

      let others = items.filter(it => it.id !== target.id && !usedIds.has(it.id));
      if (others.length < CHOICES - 1) {
        usedIds.clear();
        others = items.filter(it => it.id !== target.id);
      }
      const picked = App.shuffle(others).slice(0, CHOICES - 1).concat(target);
      picked.forEach(it => usedIds.add(it.id));
      return App.shuffle(picked);
    }

    function progressDots() {
      const progress = document.createElement('div');
      progress.className = 'fi-progress';
      progress.setAttribute('aria-label', 'Question ' + (round + 1) + ' of ' + ROUNDS);
      for (let d = 0; d < ROUNDS; d++) {
        const dot = document.createElement('span');
        dot.className = 'fi-dot' + (d < round ? ' done' : '') + (d === round ? ' current' : '');
        progress.appendChild(dot);
      }
      return progress;
    }

    function startRound() {
      const my = ++step;
      locked = true;
      area.innerHTML = '';
      const choices = pickItems();
      area.appendChild(progressDots());

      const prompt = document.createElement('div');
      prompt.className = 'prompt-row';
      prompt.innerHTML =
        '<span class="prompt-text">' + whereIs(target) + '<span class="fi-highlight"></span>?</span>' +
        '<button type="button" class="say-btn" aria-label="Hear the question again"></button>';
      prompt.querySelector('.fi-highlight').textContent = target.name;
      prompt.querySelector('.say-btn').addEventListener('click', askQuestion);
      area.appendChild(prompt);
      App.coach(prompt);

      const grid = document.createElement('div');
      grid.className = 'fi-grid';
      choices.forEach((item, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'fi-card fi-bounce';
        card.style.animationDelay = (i * 0.08) + 's';
        card.setAttribute('aria-label', item.name);
        const emoji = document.createElement('span');
        emoji.className = 'fi-emoji';
        renderIcon(emoji, item);
        const label = document.createElement('span');
        label.className = 'fi-label';
        label.textContent = item.name;
        card.appendChild(emoji);
        card.appendChild(label);
        card.addEventListener('animationend', e => { if (e.animationName === 'bounceIn') card.classList.remove('fi-bounce'); });
        card.addEventListener('click', () => handleTap(item, card));
        grid.appendChild(card);
      });
      area.appendChild(grid);

      setTimeout(() => {
        if (my !== step) return;
        askQuestion();
        locked = false;
      }, 450);
    }

    function handleTap(item, card) {
      if (locked) return;
      locked = true;
      card.classList.remove('fi-bounce');
      const my = step;

      if (item.id === target.id) {
        card.classList.add('fi-correct');
        if (App.wordResult(target.id, !missedThis)) newlyKnown.push(target);
        const rect = card.getBoundingClientRect();
        App.burst(stars, rect.left + rect.width / 2, rect.top + rect.height / 2, 12);
        const dot = area.querySelectorAll('.fi-dot')[round];
        if (dot) { dot.classList.remove('current'); dot.classList.add('done'); }

        const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
        speak(cheer + ' ' + item.name + '!', 0.85, () => { if (my === step) showLearnMoment(item); });
      } else {
        misses++;
        missedThis = true;
        card.classList.remove('fi-wrong');
        void card.offsetWidth;
        card.classList.add('fi-wrong');
        // say why, then ask again so a child who can't read still knows what to find
        speak('Oops! Try again!', 0.85, () => { if (my === step) askQuestion(); });
        setTimeout(() => {
          if (my !== step) return;
          card.classList.remove('fi-wrong');
          locked = false;
        }, 700);
      }
    }

    function nextRound() {
      round++;
      if (round < ROUNDS) startRound(); else showComplete();
    }

    function showLearnMoment(item) {
      const my = ++step;
      area.innerHTML = '';
      area.appendChild(progressDots());

      const phonics = item.name.split('').join(' · ');
      const telugu = TELUGU[item.id] || '';
      const sentences = SENTENCES[item.id] || [];
      const sentence = sentences.length ? sentences[Math.floor(Math.random() * sentences.length)] : '';

      const learn = document.createElement('div');
      learn.className = 'fi-learn';
      const emoji = document.createElement('div');
      emoji.className = 'fi-learn-emoji';
      renderIcon(emoji, item);
      learn.appendChild(emoji);
      if (newlyKnown.indexOf(item) !== -1) {
        const badge = document.createElement('div');
        badge.className = 'fi-known';
        badge.innerHTML = App.icon('star') + 'You know this word now!';
        learn.appendChild(badge);
      }
      [['fi-learn-word', item.name], ['fi-learn-phonics', phonics], ['fi-learn-telugu', telugu], ['fi-learn-sentence', sentence]]
        .forEach(([cls, text]) => {
          if (!text) return;
          const d = document.createElement('div');
          d.className = cls;
          d.textContent = text;
          if (cls === 'fi-learn-telugu') d.lang = 'te';
          learn.appendChild(d);
        });

      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'btn';
      next.style.setProperty('--b', '#3FB2FF');
      next.innerHTML = round < ROUNDS - 1 ? 'Next' + App.icon('next') : App.icon('star') + 'Finish';
      next.addEventListener('click', () => { if (my === step) { Speech.stop(); nextRound(); } });
      learn.appendChild(next);
      area.appendChild(learn);

      let speakText = item.name + '. ' + phonics.replace(/·/g, ',') + '. ' + item.name + '.';
      if (sentence) speakText += ' ' + sentence;
      speak(speakText, 0.7, () => {
        if (my !== step) return;
        const after = () => setTimeout(() => { if (my === step) nextRound(); }, 1500);
        if (telugu) Speech.speak(telugu, 0.8, () => { if (my === step) after(); }, { lang: 'te' });
        else after();
      });
    }

    function showComplete() {
      step++;
      App.roundResult(misses <= 1 ? 'great' : misses <= 3 ? 'ok' : 'hard');
      App.celebrate({
        title: 'Superstar!', stars: 3,
        say: 'Superstar! You found them all!' + (newlyKnown.length ? ' And you know new words now!' : ''),
        text: 'You found ' + ROUNDS + ' ' + currentCat.name.toLowerCase() + '!' +
          (newlyKnown.length ? ' New words you know: ' + newlyKnown.map(it => it.name).join(', ') + '.' : ''),
        buttons: [
          { label: 'Play again', icon: 'again', onClick: () => { resetGame(); startRound(); } },
          { label: 'New topic', icon: 'shuffle', ghost: true, onClick: showCategoryPicker }
        ]
      });
    }

    showCategoryPicker();
  </script>
</body>
</html>
