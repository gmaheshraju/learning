<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find It! — Heshvitha's Learning World</title>
  <meta name="description" content="Playful learning for little ones: match, listen, discover, trace and read along, with Telugu hints.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFBF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1A2A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=15">
  <style>
    .fi-wrap { max-width: 760px; margin: 0 auto; }
    .fi-title { text-align: center; font-size: clamp(18px, 2.6vmin, 30px); font-weight: 900; margin: 4px 0 12px; color: var(--textM); }

    .fi-prompt {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 8px 4px 6px; animation: slideUp .4s ease-out; text-align: center;
    }
    .fi-prompt-text {
      font-size: clamp(22px, 4.6vmin, 44px); font-weight: 900; line-height: 1.25; color: var(--text);
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .fi-prompt-text .fi-highlight { color: var(--p0ink); }
    .fi-replay {
      flex: none; width: var(--tap); height: var(--tap); border-radius: 50%;
      border: 2px solid var(--line); background: var(--card); cursor: pointer;
      font-family: var(--emoji); font-size: 20px; display: grid; place-items: center;
      box-shadow: 0 2px 8px var(--sh);
    }
    .fi-replay:active { transform: scale(.9); }
    .fi-prompt-sub { text-align: center; font-size: clamp(13px, 2vmin, 20px); color: var(--textL); font-weight: 700; margin-bottom: 4px; }

    .fi-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 2.2vmin, 22px);
      padding: 8px 2px;
      width: 100%; max-width: clamp(330px, 62vmin, 640px); margin: 0 auto;
    }
    .fi-card {
      -webkit-appearance: none; appearance: none;
      aspect-ratio: 1; min-width: 0;
      container-type: inline-size;
      background: var(--card);
      border: clamp(3px, .6vmin, 6px) solid var(--line);
      border-radius: clamp(18px, 3vmin, 30px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .12s;
      user-select: none; -webkit-user-select: none;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
      position: relative; overflow: hidden; padding: 0;
    }
    .fi-card:active { transform: scale(.93); }
    .fi-emoji { font-size: clamp(48px, 13vmin, 120px); font-size: 52cqi; transition: transform .3s; }
    .fi-label {
      font-size: clamp(12px, 2.2vmin, 22px); font-size: 10cqi; font-weight: 900;
      margin-top: 4px; color: var(--textL); text-transform: uppercase; letter-spacing: 1px;
      opacity: 0; transition: opacity .3s;
    }
    .fi-card.fi-correct { border-color: #7EC850; background: var(--ok-bg); animation: celebrate .5s ease forwards; }
    .fi-card.fi-correct .fi-emoji { transform: scale(1.12); }
    .fi-card.fi-correct .fi-label { opacity: 1; color: var(--p3ink); }
    .fi-card.fi-wrong { animation: wiggle .45s ease; border-color: #ffb3c0; }
    .fi-card.fi-bounce { animation: bounceIn .4s ease-out both; }

    .fi-learn {
      text-align: center; padding: 12px 8px; animation: fadeIn .4s ease-out;
      max-width: 520px; margin: 0 auto;
    }
    .fi-learn-emoji { font-size: clamp(64px, 16vmin, 150px); line-height: 1; }
    .fi-learn-word { font-size: clamp(34px, 7.5vmin, 72px); font-weight: 900; margin: 8px 0 2px; color: var(--text); letter-spacing: 2px; word-break: break-word; }
    .fi-learn-phonics { font-size: clamp(16px, 3.2vmin, 28px); font-weight: 800; color: var(--p1ink); letter-spacing: 3px; margin-bottom: 4px; }
    .fi-learn-telugu { font-size: clamp(19px, 3.8vmin, 32px); font-weight: 700; color: var(--textL); margin-bottom: 10px; }
    .fi-learn-sentence {
      font-size: clamp(16px, 2.8vmin, 26px); font-weight: 700; color: var(--textM); line-height: 1.55;
      padding: 10px 16px; border-radius: 14px; background: var(--sh); margin-bottom: 14px;
    }

    .fi-stars-c { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }

    .fi-progress { display: flex; justify-content: center; gap: 8px; padding: 4px 0; }
    .fi-dot { width: clamp(10px, 2vmin, 16px); height: clamp(10px, 2vmin, 16px); border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
    .fi-dot.done { background: #7EC850; transform: scale(1.15); }
    .fi-dot.current { background: #F5A623; transform: scale(1.25); }

    .fi-complete { text-align: center; padding: 24px 16px; animation: bounceIn .5s ease-out; }
    .fi-complete .fi-big { font-family: var(--emoji); font-size: clamp(64px, 16vmin, 130px); display: block; animation: float 2s ease-in-out infinite; }
    .fi-complete h2 { font-size: clamp(26px, 5.4vmin, 52px); font-weight: 900; animation: rainbow 2.5s linear infinite; margin: 10px 0; }
    .fi-complete p { font-size: clamp(15px, 2.6vmin, 26px); color: var(--textL); font-weight: 700; margin-bottom: 18px; }

    /* Phones held sideways: four pictures in one row */
    @media (orientation: landscape) and (max-height: 520px) {
      .fi-grid { grid-template-columns: repeat(4, 1fr); max-width: min(680px, 100%); padding-top: 4px; }
      .fi-prompt { padding: 2px; }
      .fi-prompt-sub { display: none; }
      .fi-learn { display: grid; grid-template-columns: auto 1fr; column-gap: 20px; align-items: center; max-width: 760px; text-align: left; }
      .fi-learn-emoji { grid-row: span 6; font-size: clamp(90px, 34vh, 150px); }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="hdr with-sound">
      <h1><em style="color:#E85D75">F</em><em style="color:#F5A623">i</em><em style="color:#7EC850">n</em><em style="color:#4DADEA">d</em> <em style="color:#B07CD8">I</em><em style="color:#E85D75">t</em><em style="color:#F5A623">!</em></h1>
      <p class="sub">Listen and tap the right picture!</p>
      <button type="button" class="sound-btn" aria-pressed="true" aria-label="Sound is on">🔊</button>
    </header>
    <nav class="nav-links" aria-label="Activities" data-page="find"></nav>

    <main class="fi-wrap" id="fi-area"></main>
    <div class="fi-stars-c" id="fi-stars" aria-hidden="true"></div>
  </div>

  <script src="js/common.js?v=15"></script>
  <script src="js/data.js?v=15"></script>
  <script src="js/telugu.js?v=15"></script>
  <script>
    const ROUNDS = 6;
    const CHOICES = 4;
    const CHEERS = [
      'Yes! Amazing!', 'You found it!', 'Great job!', 'Wow, so smart!',
      'Brilliant!', 'You got it!', 'Super!', 'Wonderful!'
    ];

    const area = document.getElementById('fi-area');
    const stars = document.getElementById('fi-stars');
    let currentCat = null;
    let round = 0;
    let target = null;
    let locked = false;
    let usedIds = new Set();
    let usedTargets = new Set();
    let step = 0;   // bumps on every screen change so stale timers/callbacks drop out

    function speak(text, rate, onEnd) { Speech.speak(text, rate || 0.8, onEnd); }
    function askQuestion() { speak('Where is the ' + target.name + '?', 0.75); }

    function resetGame() {
      round = 0;
      usedIds.clear();
      usedTargets.clear();
    }

    function showCategoryPicker() {
      step++;
      Speech.stop();
      resetGame();
      area.innerHTML = '<h2 class="fi-title">Pick a topic!</h2>';

      const grid = document.createElement('div');
      grid.className = 'cat-grid';
      CATEGORIES.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cat-btn';
        btn.style.animationDelay = (i * 0.05) + 's';
        btn.innerHTML = '<span class="cat-emoji" aria-hidden="true">' + cat.emoji + '</span><span class="cat-name">' + cat.name + '</span>';
        btn.addEventListener('click', () => { currentCat = cat; resetGame(); startRound(); });
        grid.appendChild(btn);
      });
      area.appendChild(grid);
    }

    function pickItems() {
      const items = currentCat.items;
      let available = items.filter(it => !usedIds.has(it.id));
      if (available.length < CHOICES) {
        usedIds.clear();
        available = items.slice();
      }
      const picked = App.shuffle(available).slice(0, CHOICES);
      picked.forEach(it => usedIds.add(it.id));

      // never ask for the same thing twice in one game
      const fresh = picked.filter(it => !usedTargets.has(it.id));
      const pool = fresh.length ? fresh : picked;
      target = pool[Math.floor(Math.random() * pool.length)];
      usedTargets.add(target.id);
      return App.shuffle(picked);
    }

    function progressDots() {
      const progress = document.createElement('div');
      progress.className = 'fi-progress';
      progress.setAttribute('aria-label', 'Question ' + (round + 1) + ' of ' + ROUNDS);
      for (let d = 0; d < ROUNDS; d++) {
        const dot = document.createElement('span');
        dot.className = 'fi-dot' + (d < round ? ' done' : '') + (d === round ? ' current' : '');
        progress.appendChild(dot);
      }
      return progress;
    }

    function startRound() {
      const my = ++step;
      locked = true;
      area.innerHTML = '';
      const choices = pickItems();
      area.appendChild(progressDots());

      const prompt = document.createElement('div');
      prompt.className = 'fi-prompt';
      prompt.innerHTML =
        '<button type="button" class="fi-prompt-text">Where is the <span class="fi-highlight"></span>?</button>' +
        '<button type="button" class="fi-replay" aria-label="Hear the question again">🔊</button>';
      prompt.querySelector('.fi-highlight').textContent = target.name;
      prompt.querySelectorAll('button').forEach(b => b.addEventListener('click', askQuestion));
      area.appendChild(prompt);

      const sub = document.createElement('div');
      sub.className = 'fi-prompt-sub';
      sub.textContent = 'Tap the right picture!';
      area.appendChild(sub);

      const grid = document.createElement('div');
      grid.className = 'fi-grid';
      choices.forEach((item, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'fi-card fi-bounce';
        card.style.animationDelay = (i * 0.08) + 's';
        card.setAttribute('aria-label', item.name);
        const emoji = document.createElement('span');
        emoji.className = 'fi-emoji';
        renderIcon(emoji, item);
        const label = document.createElement('span');
        label.className = 'fi-label';
        label.textContent = item.name;
        card.appendChild(emoji);
        card.appendChild(label);
        card.addEventListener('animationend', e => { if (e.animationName === 'bounceIn') card.classList.remove('fi-bounce'); });
        card.addEventListener('click', () => handleTap(item, card));
        grid.appendChild(card);
      });
      area.appendChild(grid);

      setTimeout(() => {
        if (my !== step) return;
        askQuestion();
        locked = false;
      }, 450);
    }

    function handleTap(item, card) {
      if (locked) return;
      locked = true;
      card.classList.remove('fi-bounce');
      const my = step;

      if (item.id === target.id) {
        card.classList.add('fi-correct');
        const rect = card.getBoundingClientRect();
        App.burst(stars, rect.left + rect.width / 2, rect.top + rect.height / 2, 12);
        const dot = area.querySelectorAll('.fi-dot')[round];
        if (dot) { dot.classList.remove('current'); dot.classList.add('done'); }

        const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
        speak(cheer + ' ' + item.name + '!', 0.85, () => { if (my === step) showLearnMoment(item); });
      } else {
        card.classList.remove('fi-wrong');
        void card.offsetWidth;
        card.classList.add('fi-wrong');
        // say why, then ask again so a child who can't read still knows what to find
        speak('Oops! Try again!', 0.85, () => { if (my === step) askQuestion(); });
        setTimeout(() => {
          if (my !== step) return;
          card.classList.remove('fi-wrong');
          locked = false;
        }, 700);
      }
    }

    function nextRound() {
      round++;
      if (round < ROUNDS) startRound(); else showComplete();
    }

    function showLearnMoment(item) {
      const my = ++step;
      area.innerHTML = '';
      area.appendChild(progressDots());

      const phonics = item.name.split('').join(' · ');
      const telugu = TELUGU[item.id] || '';
      const sentences = SENTENCES[item.id] || [];
      const sentence = sentences.length ? sentences[Math.floor(Math.random() * sentences.length)] : '';

      const learn = document.createElement('div');
      learn.className = 'fi-learn';
      const emoji = document.createElement('div');
      emoji.className = 'fi-learn-emoji';
      renderIcon(emoji, item);
      learn.appendChild(emoji);
      [['fi-learn-word', item.name], ['fi-learn-phonics', phonics], ['fi-learn-telugu', telugu], ['fi-learn-sentence', sentence]]
        .forEach(([cls, text]) => {
          if (!text) return;
          const d = document.createElement('div');
          d.className = cls;
          d.textContent = text;
          if (cls === 'fi-learn-telugu') d.lang = 'te';
          learn.appendChild(d);
        });

      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'btn';
      next.style.background = '#2F9BE0';
      next.textContent = round < ROUNDS - 1 ? 'Next →' : 'Finish 🏆';
      next.addEventListener('click', () => { if (my === step) { Speech.stop(); nextRound(); } });
      learn.appendChild(next);
      area.appendChild(learn);

      let speakText = item.name + '. ' + phonics.replace(/·/g, ',') + '. ' + item.name + '.';
      if (sentence) speakText += ' ' + sentence;
      speak(speakText, 0.7, () => {
        setTimeout(() => { if (my === step) nextRound(); }, 1500);
      });
    }

    function showComplete() {
      step++;
      area.innerHTML =
        '<div class="fi-complete">' +
          '<span class="fi-big" aria-hidden="true">🏆</span>' +
          '<h2>Superstar!</h2>' +
          '<p>You found ' + ROUNDS + ' ' + currentCat.name.toLowerCase() + '!</p>' +
          '<div class="btn-stack">' +
            '<button type="button" class="btn" style="background:#5DB534" id="fi-again">Play Again <span class="emoji">🔄</span></button>' +
            '<button type="button" class="btn" style="background:#2F9BE0" id="fi-new">New Topic <span class="emoji">🎯</span></button>' +
          '</div>' +
        '</div>';

      for (let i = 0; i < 5; i++) {
        App.burst(stars, Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.6, 12);
      }
      speak('Superstar! You found them all!', 0.85);

      document.getElementById('fi-again').addEventListener('click', () => { resetGame(); startRound(); });
      document.getElementById('fi-new').addEventListener('click', showCategoryPicker);
    }

    showCategoryPicker();
  </script>
</body>
</html>
