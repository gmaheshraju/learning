<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trace · Heshvi</title>
  <meta name="description" content="Letters and numbers. Calm, playful learning for ages 2 to 7. No ads, no sign-up, works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15122A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load without blocking the first paint (a slow network must never mean a blank screen) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20">
  <style>
    .tr-wrap {
      --size: clamp(240px, min(90vw, 100dvh - 360px), 600px);
      display: grid; grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "label" "modes" "canvas" "progress" "controls" "letters";
      justify-items: center; max-width: 1180px; margin: 0 auto;
    }
    .tr-top { grid-area: label; margin-bottom: 8px; }
    .tr-letter-label span { color: var(--accent); font-size: 1.2em; }
    .tr-mode-toggle { grid-area: modes; margin: 0 0 10px; }
    .tr-mode-btn { min-width: 70px; font-size: 18px; }

    .tr-canvas-wrap {
      grid-area: canvas;
      position: relative; width: var(--size); height: var(--size);
      background: #fff;
      border-radius: clamp(24px, 4vmin, 38px);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    .tr-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* drawn at full strength, made see-through here, so overlapping strokes stay even */
    #tr-draw { opacity: .62; cursor: crosshair; }

    .tr-progress-bar {
      grid-area: progress;
      width: min(var(--size), 360px); height: 14px; margin: 12px auto 4px;
      background: var(--line); border-radius: 8px; overflow: hidden;
    }
    .tr-progress-fill { height: 100%; width: 0%; background: var(--good); border-radius: 8px; transition: width .25s; }

    .tr-controls { grid-area: controls; display: flex; justify-content: center; gap: 12px; margin: 8px 0; }
    .tr-controls .btn { font-size: clamp(15px, 2vmin, 20px); }
    @keyframes nudge { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.1) } }
    .btn.nudge { animation: nudge .9s ease-in-out infinite; }

    .tr-letter-nav {
      grid-area: letters;
      display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
      margin: 6px 0; max-width: 640px;
    }
    .tr-letter-btn {
      width: var(--tap); height: var(--tap);
      border: 3px solid transparent; border-radius: 14px;
      background: var(--surface); box-shadow: var(--shadow-sm); font-family: var(--display); font-size: clamp(18px, 2.4vmin, 23px);
      font-weight: 600; cursor: pointer; color: var(--ink);
      transition: border-color .2s, background-color .2s, color .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .tr-letter-btn.done { border-color: var(--good); background: var(--ok-bg); color: var(--p3ink); }
    .tr-letter-btn.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--ink); }

    .tr-stars-c { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }

    @media (hover: hover) and (pointer: fine) {
      .tr-letter-btn:hover { border-color: var(--accent); }
    }

    /* Tablets held upright: leave room for the letter strip under the canvas */
    @media (min-width: 600px) and (orientation: portrait) {
      .tr-wrap { --size: clamp(300px, 100dvh - 540px, 620px); }
    }

    /* Wide screens and phones held sideways: canvas on the left, everything else beside it */
    @media (min-width: 760px) and (min-aspect-ratio: 5/4), (orientation: landscape) and (max-height: 520px) {
      .tr-wrap {
        --size: clamp(200px, min(56vw, 100dvh - 210px), 700px);
        grid-template-columns: auto minmax(220px, 420px);
        grid-template-areas: "canvas label" "canvas modes" "canvas progress" "canvas controls" "canvas letters";
        grid-template-rows: auto auto auto auto 1fr;
        justify-content: center; align-items: start; column-gap: clamp(16px, 3vw, 44px);
      }
      .tr-canvas-wrap { grid-row: 1 / -1; }
      .tr-top { padding-top: 8px; }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      .tr-wrap { --size: clamp(190px, 100dvh - 120px, 340px); }
      .tr-letter-nav {
        flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; max-width: 100%;
        scrollbar-width: none; padding: 2px 4px 6px; scroll-snap-type: x proximity;
      }
      .tr-letter-nav::-webkit-scrollbar { display: none; }
      .tr-letter-btn { flex: none; scroll-snap-align: center; }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="topbar" data-page="trace"></header>

    <main class="tr-wrap" id="tr-area">
      <div class="prompt-row tr-top">
        <span class="prompt-text tr-letter-label" id="tr-label" aria-live="polite">Trace the letter <span id="tr-current">A</span></span>
        <button type="button" class="say-btn" id="tr-say" aria-label="Hear it again"></button>
      </div>

      <div class="seg tr-mode-toggle" role="group" aria-label="What to trace">
        <button type="button" class="tr-mode-btn active" data-mode="upper" aria-pressed="true">ABC</button>
        <button type="button" class="tr-mode-btn" data-mode="lower" aria-pressed="false">abc</button>
        <button type="button" class="tr-mode-btn" data-mode="num" aria-pressed="false">123</button>
      </div>

      <div class="tr-canvas-wrap" id="tr-canvas-wrap">
        <canvas id="tr-guide" aria-hidden="true"></canvas>
        <canvas id="tr-draw" aria-label="Tracing area. Draw over the letter with your finger."></canvas>
      </div>

      <div class="tr-progress-bar" role="progressbar" aria-label="Tracing progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="tr-bar">
        <div class="tr-progress-fill" id="tr-fill"></div>
      </div>

      <div class="tr-controls">
        <button type="button" class="btn ghost" id="tr-clear" data-icon="erase">Clear</button>
        <button type="button" class="btn" id="tr-next">Next</button>
      </div>

      <div class="tr-letter-nav" id="tr-nav" role="group" aria-label="Pick a letter"></div>
    </main>
    <div class="tr-stars-c" id="tr-stars" aria-hidden="true"></div>
  </div>

  <script src="js/common.js?v=20"></script>
  <script>
    document.getElementById('tr-next').insertAdjacentHTML('beforeend', App.icon('next'));
    var SETS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
      lower: 'abcdefghijklmnopqrstuvwxyz'.split(''),
      num: '0123456789'.split('')
    };
    var NUM_NAMES = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
    var COLORS = ['#E85D75', '#F5A623', '#7EC850', '#4DADEA', '#B07CD8'];
    var DONE_AT = 60;      // % of the letter covered to count as traced
    var MASK = 96;         // progress is measured on a small grid: cheap on any device

    var mode = 'upper';
    var letters = SETS.upper;
    var currentIdx = 0;
    var completed = new Set();

    var wrap = document.getElementById('tr-canvas-wrap');
    var guideCanvas = document.getElementById('tr-guide');
    var drawCanvas = document.getElementById('tr-draw');
    var guideCtx = guideCanvas.getContext('2d');
    var drawCtx = drawCanvas.getContext('2d');
    var size = 0, dpr = 1;

    // Low-resolution copies of the letter and of the ink, used only for scoring.
    function maskCanvas() {
      var c = document.createElement('canvas');
      c.width = c.height = MASK;
      return c.getContext('2d', { willReadFrequently: true });
    }
    var letterMaskCtx = maskCanvas();
    var inkCtx = maskCanvas();
    var letterMask = new Uint8Array(MASK * MASK);
    var letterCount = 0;

    var navBtns = [];
    var stars = document.getElementById('tr-stars');
    var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function speak(text, rate) { Speech.speak(text, rate || 0.8); }

    function letterName(l) {
      if (mode === 'num') return 'the number ' + NUM_NAMES[+l];
      if (mode === 'lower') return 'the small letter ' + l;
      return 'the letter ' + l;
    }

    function sayLetter() { speak('Trace ' + letterName(letters[currentIdx]), 0.8); }

    /* ---------- canvas sizing ---------- */
    function fitCanvas() {
      var newSize = wrap.clientWidth;
      var newDpr = Math.min(window.devicePixelRatio || 1, 3);
      if (!newSize || (newSize === size && newDpr === dpr)) return false;

      // keep what has been drawn when the device rotates or the window resizes
      var old = null;
      if (size) {
        old = document.createElement('canvas');
        old.width = drawCanvas.width; old.height = drawCanvas.height;
        old.getContext('2d').drawImage(drawCanvas, 0, 0);
      }
      size = newSize; dpr = newDpr;
      guideCanvas.width = guideCanvas.height = drawCanvas.width = drawCanvas.height = Math.round(size * dpr);
      guideCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (old) drawCtx.drawImage(old, 0, 0, size, size);
      return true;
    }

    /* ---------- the letter to trace ---------- */
    function guideFont(px) { return '700 ' + px + 'px Andika, Nunito, "Trebuchet MS", system-ui, sans-serif'; }

    // Centre the letter's actual ink (not its em box) so "g" or "7" sit in the middle too.
    function layoutLetter(ctx, letter) {
      var fontSize = size * 0.7;
      ctx.font = guideFont(fontSize);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      var m = ctx.measureText(letter);
      var h = (m.actualBoundingBoxAscent || fontSize * .7) + (m.actualBoundingBoxDescent || 0);
      var w = (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight || m.width);
      var fit = Math.min(1, (size * 0.76) / h, (size * 0.8) / w);
      if (fit < 1) {
        fontSize *= fit;
        ctx.font = guideFont(fontSize);
        m = ctx.measureText(letter);
      }
      var asc = m.actualBoundingBoxAscent || fontSize * .7, desc = m.actualBoundingBoxDescent || 0;
      var left = m.actualBoundingBoxLeft || m.width / 2, right = m.actualBoundingBoxRight || m.width / 2;
      return { x: size / 2 + (left - right) / 2, y: size / 2 + (asc - desc) / 2 };
    }

    function drawGuide() {
      var letter = letters[currentIdx];
      var dark = darkQuery.matches;
      guideCtx.clearRect(0, 0, size, size);

      guideCtx.strokeStyle = dark ? 'rgba(255,255,255,.12)' : '#ECE4E4';
      guideCtx.lineWidth = 1.5;
      guideCtx.setLineDash([8, 8]);
      guideCtx.beginPath();
      guideCtx.moveTo(0, size / 2); guideCtx.lineTo(size, size / 2);
      guideCtx.moveTo(size / 2, 0); guideCtx.lineTo(size / 2, size);
      guideCtx.stroke();

      var at = layoutLetter(guideCtx, letter);
      guideCtx.fillStyle = dark ? 'rgba(255,255,255,.09)' : 'rgba(150,130,135,.13)';
      guideCtx.fillText(letter, at.x, at.y);
      guideCtx.strokeStyle = dark ? 'rgba(255,255,255,.42)' : '#CFC4C6';
      guideCtx.lineWidth = Math.max(2.5, size / 140);
      guideCtx.setLineDash([size / 36, size / 60]);
      guideCtx.lineJoin = 'round';
      guideCtx.strokeText(letter, at.x, at.y);
      guideCtx.setLineDash([]);

      // the same letter, solid, on the scoring grid
      letterMaskCtx.setTransform(1, 0, 0, 1, 0, 0);
      letterMaskCtx.clearRect(0, 0, MASK, MASK);
      letterMaskCtx.setTransform(MASK / size, 0, 0, MASK / size, 0, 0);
      layoutLetter(letterMaskCtx, letter);
      letterMaskCtx.fillStyle = '#000';
      letterMaskCtx.fillText(letter, at.x, at.y);
      var data = letterMaskCtx.getImageData(0, 0, MASK, MASK).data;
      letterCount = 0;
      for (var i = 0; i < letterMask.length; i++) {
        letterMask[i] = data[i * 4 + 3] > 110 ? 1 : 0;
        letterCount += letterMask[i];
      }
    }

    /* ---------- drawing ---------- */
    var activeId = null, activeType = '', last = null, rect = null;

    function strokeStyle(ctx) {
      ctx.strokeStyle = ctx.fillStyle = COLORS[currentIdx % COLORS.length];
      ctx.lineWidth = size * 0.085;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function paint(from, to) {
      [drawCtx, inkCtx].forEach(function (ctx) {
        if (ctx === inkCtx) ctx.setTransform(MASK / size, 0, 0, MASK / size, 0, 0);
        strokeStyle(ctx);
        ctx.beginPath();
        if (from) { ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); }
        else { ctx.arc(to.x, to.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
      });
    }

    function pos(e) {
      return { x: (e.clientX - rect.left) * size / rect.width, y: (e.clientY - rect.top) * size / rect.height };
    }

    drawCanvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      // A second finger or a resting palm must not hijack the stroke; a pen may take over from a finger.
      if (activeId !== null && !(e.pointerType === 'pen' && activeType === 'touch')) return;
      if (e.pointerType === 'touch' && (e.width > 60 || e.height > 60)) return;
      e.preventDefault();
      activeId = e.pointerId;
      activeType = e.pointerType;
      try { drawCanvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      rect = drawCanvas.getBoundingClientRect();
      last = pos(e);
      paint(null, last);   // a single tap leaves a dot (and dots the i)
      queueCheck();
    });

    drawCanvas.addEventListener('pointermove', function (e) {
      if (e.pointerId !== activeId) return;
      e.preventDefault();
      var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      if (!evs.length) evs = [e];
      for (var i = 0; i < evs.length; i++) {
        var p = pos(evs[i]);
        paint(last, p);
        last = p;
      }
      queueCheck();
    });

    function endStroke(e) {
      if (e.pointerId !== activeId) return;
      activeId = null;
      last = null;
      queueCheck();
    }
    drawCanvas.addEventListener('pointerup', endStroke);
    drawCanvas.addEventListener('pointercancel', endStroke);
    // iOS: stop a long press on the canvas from opening the magnifier/menu
    drawCanvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    /* ---------- scoring ---------- */
    var checkQueued = false;
    function queueCheck() {
      if (checkQueued) return;
      checkQueued = true;
      requestAnimationFrame(function () { checkQueued = false; checkProgress(); });
    }

    function setBar(pct) {
      var shown = Math.min(100, Math.round(pct / DONE_AT * 100));
      document.getElementById('tr-fill').style.width = shown + '%';
      document.getElementById('tr-bar').setAttribute('aria-valuenow', String(shown));
    }

    var traced = 0;
    function checkProgress() {
      if (!letterCount) return;
      var ink = inkCtx.getImageData(0, 0, MASK, MASK).data;
      var overlap = 0;
      for (var i = 0; i < letterMask.length; i++) {
        if (letterMask[i] && ink[i * 4 + 3] > 40) overlap++;
      }
      var pct = overlap / letterCount * 100;
      setBar(pct);

      if (pct >= DONE_AT && !completed.has(currentIdx)) {
        completed.add(currentIdx);
        App.roundResult('great');
        traced++;
        var r = wrap.getBoundingClientRect();
        App.burst(stars, r.left + r.width / 2, r.top + r.height / 2, 12, r.width * .8);
        var said = 'Great job! ' + (mode === 'num' ? NUM_NAMES[+letters[currentIdx]] : letters[currentIdx]) + '!';
        updateNav();
        document.getElementById('tr-next').classList.add('nudge');
        if (traced % 3 === 0) {   // every third letter: a sticker
          App.celebrate({ title: 'Super tracing!', say: said, stars: 3, auto: 4000,
            buttons: [{ label: 'Next', icon: 'next', onClick: function () { document.getElementById('tr-next').click(); } }] });
        } else speak(said, 0.85);
      }
    }

    function clearDraw() {
      drawCtx.clearRect(0, 0, size, size);
      inkCtx.setTransform(1, 0, 0, 1, 0, 0);
      inkCtx.clearRect(0, 0, MASK, MASK);
      setBar(0);
    }

    /* ---------- letters, modes ---------- */
    function buildNav() {
      var nav = document.getElementById('tr-nav');
      nav.innerHTML = '';
      navBtns = letters.map(function (l, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tr-letter-btn';
        btn.textContent = l;
        btn.setAttribute('aria-label', letterName(l));
        btn.addEventListener('click', function () { setLetter(i); });
        nav.appendChild(btn);
        return btn;
      });
    }

    function updateNav() {
      navBtns.forEach(function (btn, i) {
        btn.classList.toggle('active', i === currentIdx);
        btn.classList.toggle('done', completed.has(i));
        btn.setAttribute('aria-pressed', String(i === currentIdx));
      });
      App.revealInRow(navBtns[currentIdx], true);
    }

    function setLetter(idx) {
      currentIdx = idx;
      var label = mode === 'num' ? 'number' : 'letter';
      document.getElementById('tr-label').innerHTML = 'Trace the ' + label + ' <span id="tr-current"></span>';
      document.getElementById('tr-current').textContent = letters[idx];
      document.getElementById('tr-next').classList.remove('nudge');
      clearDraw();
      drawGuide();
      updateNav();
      sayLetter();
    }

    function setMode(m) {
      mode = m;
      letters = SETS[m];
      completed.clear();
      document.querySelectorAll('.tr-mode-btn').forEach(function (b) {
        var on = b.dataset.mode === m;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      buildNav();
      setLetter(0);
    }

    document.getElementById('tr-clear').addEventListener('click', function () {
      completed.delete(currentIdx);
      clearDraw();
      updateNav();
      document.getElementById('tr-next').classList.remove('nudge');
    });
    document.getElementById('tr-next').addEventListener('click', function () {
      setLetter((currentIdx + 1) % letters.length);
    });
    document.getElementById('tr-say').addEventListener('click', sayLetter);
    document.querySelectorAll('.tr-mode-btn').forEach(function (b) {
      b.addEventListener('click', function () { setMode(b.dataset.mode); });
    });

    // Re-fit on rotation / resize, keeping the drawing.
    if (window.ResizeObserver) {
      new ResizeObserver(function () { if (fitCanvas()) drawGuide(); }).observe(wrap);
    } else {
      window.addEventListener('resize', function () { if (fitCanvas()) drawGuide(); });
    }
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', drawGuide);
    // The tracing font may arrive after the first letter was drawn.
    if (document.fonts && document.fonts.load) {
      document.fonts.load(guideFont(100), 'Aag').then(function () { if (size) drawGuide(); });
    }

    fitCanvas();
    buildNav();
    setLetter(0);
  </script>
</body>
</html>
