<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memory · Heshvi</title>
  <meta name="description" content="Flip, remember, match. Calm, playful learning for ages 2 to 7. No ads, no sign-up, works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15122A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load without blocking the first paint (a slow network must never mean a blank screen) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=17">
  <style>
    .mm { max-width: 900px; margin: 0 auto; }
    .turns { display: flex; justify-content: center; gap: 10px; margin: 0 0 10px; }
    .player {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
      border: 3px solid transparent; background: var(--surface); box-shadow: var(--shadow-sm);
      font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--ink-2);
      transition: border-color .2s, transform .2s var(--spring);
    }
    .player .emoji { font-size: 22px; }
    .player.now { border-color: var(--accent); color: var(--ink); transform: scale(1.06); }
    .player b { font-size: 18px; }

    .board { display: grid; gap: clamp(8px, 1.6vmin, 14px); justify-content: center; margin: 0 auto; perspective: 900px; }
    .mcard {
      position: relative; width: var(--w); height: var(--h); padding: 0; border: none; background: none; cursor: pointer;
      transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,1.3,.5,1);
    }
    .mcard.up { transform: rotateY(180deg); }
    .mcard .face {
      position: absolute; inset: 0; border-radius: clamp(14px, 2vmin, 22px); display: grid; place-items: center;
      backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: var(--shadow-sm), inset 0 -5px 0 rgba(0,0,0,.08);
    }
    .mcard .back {
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.28) 0 32%, transparent 33%),
        linear-gradient(150deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent));
      border: 4px solid rgba(255,255,255,.7);
    }
    .mcard .back svg { width: 62%; height: 62%; }
    .mcard .front {
      background: var(--surface); border: 4px solid var(--line); transform: rotateY(180deg);
      font-family: var(--emoji); font-size: calc(var(--h) * .5); line-height: 1;
    }
    .mcard .front .icon-svg { width: 1em; height: 1em; }
    .mcard.matched .front { border-color: var(--good); background: var(--ok-bg); animation: celebrate .5s ease; }
    .mcard.matched { cursor: default; }
    .moves { text-align: center; font-weight: 800; color: var(--ink-3); margin-top: 10px; font-size: 15px; min-height: 20px; }
    @media (prefers-reduced-motion: reduce) { .mcard { transition: none; } }
  </style>
</head>
<body>
  <div class="gw">
    <header class="topbar" data-page="memory"></header>
    <main class="mm">
      <div class="act-bar">
        <button type="button" class="tool-btn" id="two" data-icon="people" aria-pressed="false" aria-label="Take turns with a grown-up" title="Take turns"></button>
        <button type="button" class="tool-btn" id="again" data-icon="shuffle" aria-label="New game" title="New game"></button>
      </div>
      <div class="turns" id="turns" hidden>
        <span class="player" id="p0"><span class="emoji" aria-hidden="true">👧</span> Me <b id="s0">0</b></span>
        <span class="player" id="p1"><span class="emoji" aria-hidden="true">🧑</span> Grown-up <b id="s1">0</b></span>
      </div>
      <div class="prompt-row"><span class="prompt-text" id="prompt" aria-live="polite">Find the pairs!</span></div>
      <div class="board" id="board" role="grid" aria-label="Memory cards"></div>
      <div class="moves" id="moves"></div>
    </main>
  </div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <script src="js/common.js?v=17"></script>
  <script src="js/data.js?v=17"></script>
  <script>
    var LEVELS = [
      { age: 3, label: '2 pairs + peek', pairs: 2, peek: 2600 },
      { age: 4, label: '3 pairs + peek', pairs: 3, peek: 2000 },
      { age: 5, label: '4 pairs', pairs: 4, peek: 0 },
      { age: 6, label: '6 pairs', pairs: 6, peek: 0 },
      { age: 7, label: '8 pairs', pairs: 8, peek: 0 }
    ];
    var board = document.getElementById('board'), promptEl = document.getElementById('prompt'), movesEl = document.getElementById('moves');
    var level = 0, cards = [], first = null, lock = false, moves = 0, found = 0, two = false, turn = 0, scores = [0, 0], topic = null;

    function say(t, rate) { Speech.speak(t, rate || 0.9); }
    function setPrompt(t) { promptEl.innerHTML = t; }

    // Pick the column count that gives the biggest cards in the space available.
    function fit() {
      var n = cards.length;
      var padBottom = parseFloat(getComputedStyle(document.querySelector('.gw')).paddingBottom) || 0;
      var top = board.getBoundingClientRect().top + window.scrollY;
      var W = board.parentElement.clientWidth;
      var H = Math.max(window.innerHeight < 520 && window.innerWidth > window.innerHeight ? 150 : 260, window.innerHeight - top - padBottom - 40);
      var gap = Math.min(14, Math.max(8, W * 0.016)), best = null;
      for (var cols = 2; cols <= n; cols++) {
        if (n % cols) continue;
        var rows = n / cols;
        var w = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * 0.8, 150);
        if (!best || w > best.w) best = { cols: cols, w: w };
      }
      board.style.gridTemplateColumns = 'repeat(' + best.cols + ', auto)';
      board.style.setProperty('--w', Math.floor(best.w) + 'px');
      board.style.setProperty('--h', Math.floor(best.w * 1.25) + 'px');
    }

    function newGame() {
      var L = LEVELS[level];
      var cats = CATEGORIES.filter(function (c) { return c.items.length >= L.pairs; });
      topic = cats[Math.floor(Math.random() * cats.length)];
      var picks = App.shuffle(topic.items).slice(0, L.pairs);
      cards = App.shuffle(picks.concat(picks)).map(function (item, i) { return { item: item, i: i, up: false, matched: false }; });
      first = null; lock = false; moves = 0; found = 0; turn = 0; scores = [0, 0];
      board.innerHTML = '';
      cards.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'mcard';
        b.setAttribute('aria-label', 'Card ' + (c.i + 1) + ', face down');
        b.innerHTML = '<span class="face back" aria-hidden="true">' + App.MASCOT + '</span><span class="face front" aria-hidden="true"></span>';
        renderIcon(b.querySelector('.front'), c.item);
        b.addEventListener('click', function () { flip(c); });
        c.el = b;
        board.appendChild(b);
      });
      fit();
      updateTurns();
      movesEl.textContent = '';
      if (L.peek) {
        lock = true;
        setPrompt('Look carefully\u2026');
        cards.forEach(function (c) { c.el.classList.add('up'); });
        say('Look carefully, and remember!');
        setTimeout(function () {
          cards.forEach(function (c) { c.el.classList.remove('up'); });
          lock = false;
          setPrompt('Find the pairs!');
        }, L.peek);
      } else {
        setPrompt('Find the pairs!');
        say('Find the pairs!');
      }
    }

    function show(c, up) {
      c.up = up;
      c.el.classList.toggle('up', up);
      c.el.setAttribute('aria-label', up ? c.item.name : 'Card ' + (c.i + 1) + ', face down');
    }

    function flip(c) {
      if (lock || c.up || c.matched) return;
      show(c, true);
      App.sfx('tick');
      say(c.item.name.toLowerCase());
      if (!first) { first = c; return; }
      var a = first, b = c;
      first = null;
      moves++;
      movesEl.textContent = moves + (moves === 1 ? ' try' : ' tries');
      if (a.item.id === b.item.id) {
        a.matched = b.matched = true;
        a.el.classList.add('matched'); b.el.classList.add('matched');
        a.el.disabled = b.el.disabled = true;
        found++;
        scores[turn]++;
        updateTurns();
        setTimeout(function () { App.sfx('snap'); say('A pair! ' + cap(a.item.name.toLowerCase()) + '!'); }, 350);
        if (found === cards.length / 2) setTimeout(win, 1300);
      } else {
        lock = true;
        setTimeout(function () {
          show(a, false); show(b, false);
          lock = false;
          if (two) { turn = 1 - turn; updateTurns(); say(turn ? "Grown-up's turn!" : 'Your turn!'); }
        }, 1200);
      }
    }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function updateTurns() {
      document.getElementById('turns').hidden = !two;
      document.getElementById('p0').classList.toggle('now', turn === 0);
      document.getElementById('p1').classList.toggle('now', turn === 1);
      document.getElementById('s0').textContent = scores[0];
      document.getElementById('s1').textContent = scores[1];
    }

    function win() {
      var title = 'You found them all!', words = title, r = null;
      if (two) {
        title = scores[0] > scores[1] ? 'You win!' : scores[0] < scores[1] ? 'Grown-up wins!' : 'It\u2019s a tie!';
        words = scores[0] > scores[1] ? 'You win! Great memory!' : scores[0] < scores[1] ? 'Grown-up wins this time! Play again?' : "It's a tie! Great memory, both of you!";
      } else {
        // a perfect game takes one try per pair; a few extra is still great
        var L = LEVELS[level], extra = moves - L.pairs;
        r = App.roundResult(extra <= L.pairs ? 'great' : extra <= L.pairs * 2 ? 'ok' : 'hard');
        level = r.level;
        var w = App.roundWords(r, title);
        title = w.title; words = w.say;
      }
      setPrompt(title);
      App.celebrate({
        title: title, say: words, stars: 3, text: moves + ' tries',
        buttons: [{ label: 'Play again', icon: 'again', onClick: newGame }]
      });
    }

    document.getElementById('again').addEventListener('click', newGame);
    document.getElementById('two').addEventListener('click', function () {
      two = !two;
      this.setAttribute('aria-pressed', String(two));
      say(two ? 'Take turns! You go first.' : 'Just me!');
      newGame();
    });

    var lv = App.levelControl(document.getElementById('level'), 'memory', LEVELS, function (l) { level = l; newGame(); });
    level = lv.get();
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fit, 120); });
    newGame();
  </script>
</body>
</html>
