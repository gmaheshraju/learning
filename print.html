<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Print Cards · Heshvi</title>
  <meta name="description" content="Cut-out picture and word cards. Calm, playful learning for ages 2 to 7. No ads, no sign-up, works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15122A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load without blocking the first paint (a slow network must never mean a blank screen) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=21">
  <style>
    .print-wrap { max-width: 860px; margin: 0 auto; }
    .print-intro { text-align: center; margin-bottom: 14px; animation: slideUp .5s ease-out; }
    .print-intro p { text-wrap: balance; font-size: 16px; color: var(--ink-2); font-weight: 700; line-height: 1.5; margin-bottom: 12px; }

    .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .pcard {
      border: 3px solid; border-radius: 14px; aspect-ratio: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px; min-width: 0; box-shadow: 0 2px 8px var(--sh);
      container-type: inline-size;
    }
    .pcard-emoji { font-size: 48px; font-size: 42cqi; }
    .pcard .pname { font-size: 14px; font-size: max(10px, 10cqi); font-weight: 900; letter-spacing: 2px; margin-top: 6px; }
    .pcard-word { font-size: 22px; font-size: 17cqi; font-weight: 900; letter-spacing: 3px; text-align: center; }
    .pcard-word.pword-long { font-size: 15px; font-size: 11cqi; letter-spacing: 1px; }
    .pspell { font-size: 10px; font-size: max(8px, 7cqi); font-weight: 800; letter-spacing: 1.5px; margin-top: 4px; opacity: .7; text-align: center; }

    .section-label {
      font-size: 14px; font-weight: 800; color: var(--textL);
      text-transform: uppercase; letter-spacing: 1.5px;
      margin: 8px 0 10px; text-align: center;
    }
    .cut-line { border: none; border-top: 2px dashed var(--textL); margin: 20px 0; opacity: .35; }

    @media (max-width: 440px) {
      .card-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }

    @media print {
      .print-intro, .cat-pills { display: none !important; }
      .gw { padding: 8px; max-width: none; }
      .card-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .pcard { box-shadow: none; border-width: 2px; break-inside: avoid; }
      .cut-line { opacity: .5; }
      .section-label { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="topbar" data-page="print"></header>

    <main class="print-wrap">
      <div class="print-intro">
        <p>Pick a topic, print in colour, and cut out the cards!<br>
        Match the picture cards to the word cards on the table.</p>
        <button type="button" class="btn" style="--b:#26A69A" data-icon="printer" onclick="window.print()">Print this page</button>
      </div>

      <div class="cat-pills" id="cat-pills"></div>

      <div class="section-label" id="pic-label">✂️ Picture Cards — Cut These Out</div>
      <div class="card-grid" id="pic-cards"></div>

      <hr class="cut-line">

      <div class="section-label" id="word-label">✂️ Word Cards — Cut These Out</div>
      <div class="card-grid" id="word-cards"></div>
    </main>
  </div>

  <script src="js/common.js?v=21"></script>
  <script src="js/data.js?v=21"></script>
  <script>
    const PRINT_COLORS = ['#E85D75','#F5A623','#4DADEA','#7EC850','#B07CD8','#FF8A65',
                           '#26A69A','#AB47BC','#EF5350','#42A5F5','#66BB6A','#FFA726',
                           '#7E57C2','#EC407A','#29B6F6'];
    const PRINT_BGS = ['#FFF0F2','#FFF7EA','#EBF5FF','#F0FAE8','#F3E5F5','#FFF3E0',
                        '#E0F2F1','#F3E5F5','#FFEBEE','#E3F2FD','#E8F5E9','#FFF8E1',
                        '#EDE7F6','#FCE4EC','#E1F5FE'];

    const pillsContainer = document.getElementById('cat-pills');
    const picGrid = document.getElementById('pic-cards');
    const wordGrid = document.getElementById('word-cards');

    function renderCategory(cat) {
      picGrid.innerHTML = '';
      wordGrid.innerHTML = '';

      cat.items.forEach((a, i) => {
        const pc = PRINT_COLORS[i % PRINT_COLORS.length];
        const bg = PRINT_BGS[i % PRINT_BGS.length];

        const ac = document.createElement('div');
        ac.className = 'pcard';
        ac.style.borderColor = pc;
        ac.style.background = bg;
        const emoji = document.createElement('div');
        emoji.className = 'pcard-emoji';
        renderIcon(emoji, a);
        const name = document.createElement('div');
        name.className = 'pname';
        name.textContent = a.name;
        name.style.color = 'color-mix(in srgb, ' + pc + ' 60%, #2F2235)';   // the card's colour, dark enough to read on paper
        ac.append(emoji, name);
        picGrid.appendChild(ac);

        const wc = document.createElement('div');
        wc.className = 'pcard';
        wc.style.borderColor = pc;
        wc.style.background = bg;
        const wl = document.createElement('div');
        wl.className = 'pcard-word' + (a.name.length > 6 ? ' pword-long' : '');
        wl.textContent = a.name;
        wl.style.color = 'color-mix(in srgb, ' + pc + ' 60%, #2F2235)';
        const sp = document.createElement('div');
        sp.className = 'pspell';
        sp.textContent = a.name.split('').join(' · ');
        sp.style.color = 'color-mix(in srgb, ' + pc + ' 60%, #2F2235)';
        wc.append(wl, sp);
        wordGrid.appendChild(wc);
      });
    }

    CATEGORIES.forEach((cat, i) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'cat-pill';
      pill.innerHTML = '<span class="emoji" aria-hidden="true">' + cat.emoji + '</span>' + cat.name;
      pill.addEventListener('click', () => {
        pillsContainer.querySelectorAll('.cat-pill').forEach(p => { p.classList.remove('active'); p.setAttribute('aria-pressed', 'false'); });
        pill.classList.add('active');
        pill.setAttribute('aria-pressed', 'true');
        App.revealInRow(pill, true);
        renderCategory(cat);
      });
      pillsContainer.appendChild(pill);
      if (i === 0) { pill.classList.add('active'); pill.setAttribute('aria-pressed', 'true'); renderCategory(cat); }
    });
  </script>
</body>
</html>
