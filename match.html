<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Match · Heshvi</title>
  <meta name="description" content="Pair pictures and words. Calm, playful learning for ages 2 to 7. No ads, no sign-up, works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15122A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load without blocking the first paint (a slow network must never mean a blank screen) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>
  <div class="gw" id="game">
    <div class="stars-c" id="stars"></div>
    <header class="topbar" data-page="match"></header>
    <div class="bar" id="bar" hidden>
      <button type="button" class="cat-tag" id="cat-label" aria-label="Change topic"></button>
      <div class="it" aria-label="Score"><span class="emoji" aria-hidden="true">⭐</span> <span id="sc">0</span></div>
      <div class="it" aria-label="Round"><span class="emoji" aria-hidden="true">🎯</span> <span id="rn">1</span><span style="color:var(--textL);font-weight:600">/5</span></div>
    </div>
    <main id="play"></main>
  </div>

  <script src="js/common.js?v=20"></script>
  <script src="js/data.js?v=20"></script>
  <script src="js/game.js?v=20"></script>
</body>
</html>
