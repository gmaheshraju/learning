<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Learn — Heshvitha's Learning World</title>
  <meta name="description" content="Playful learning for little ones: match, listen, discover, trace and read along, with Telugu hints.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFBF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1A2A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=15">
  <style>
    .learn-wrap { max-width: 760px; margin: 0 auto; }
    .learn-title { text-align: center; font-size: clamp(18px, 2.6vmin, 30px); font-weight: 900; margin: 4px 0 12px; color: var(--textM); }

    .learn-card {
      --accent: #E8961A;
      background: var(--card); border-radius: clamp(20px, 3vmin, 32px);
      border-top: 5px solid var(--accent);
      padding: clamp(16px, 3vmin, 36px) clamp(14px, 3vmin, 36px);
      text-align: center; box-shadow: 0 4px 20px var(--sh);
      animation: bounceIn .5s ease-out; position: relative; overflow: hidden;
      min-height: min(440px, 64dvh);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      touch-action: pan-y pinch-zoom;
      user-select: none; -webkit-user-select: none;
    }
    .lc-body { display: flex; flex-direction: column; align-items: center; width: 100%; }

    .lc-emoji { font-size: clamp(88px, 22vmin, 180px); animation: float 2.5s ease-in-out infinite; margin-bottom: 4px; }
    .lc-word {
      font-size: clamp(34px, 7.5vmin, 76px); font-weight: 900; color: var(--accent);
      letter-spacing: 4px; line-height: 1.1; margin-bottom: 4px; word-break: break-word;
    }
    .lc-phonics {
      font-size: clamp(15px, 2.8vmin, 26px); font-weight: 800; color: var(--accent);
      letter-spacing: 5px; opacity: .75; margin-bottom: 12px;
    }
    .lc-telugu {
      font-size: clamp(19px, 3.6vmin, 32px); font-weight: 700; color: var(--p1ink);
      margin-bottom: 14px; padding: 4px 18px; border-radius: 999px;
      background: rgba(245,166,35,.13);
    }
    .lc-sentence {
      font-size: clamp(17px, 2.8vmin, 28px); font-weight: 700; line-height: 1.55; color: var(--textM);
      min-height: 2.6em; padding: 0 8px; max-width: 34ch;
    }
    .lc-sentence .highlight {
      color: var(--text); font-weight: 900;
      text-decoration: underline; text-decoration-color: #F5A623; text-decoration-thickness: 3px;
      text-underline-offset: 5px;
    }
    .lc-action {
      font-size: clamp(15px, 2.4vmin, 22px); font-weight: 800; color: var(--p0ink);
      margin-top: 8px; padding: 6px 16px; border-radius: 14px;
      background: rgba(232,93,117,.1); animation: float 2s ease-in-out infinite;
    }

    .lc-progress { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 14px 0 4px; }
    .lc-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
    .lc-dot.active { background: #F5A623; transform: scale(1.35); }
    .lc-dot.done { background: #7EC850; }
    .lc-counter { font-size: 13px; color: var(--textL); font-weight: 800; }

    .lc-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .lc-controls .btn { font-size: clamp(15px, 1.9vmin, 20px); padding: 10px 20px; }

    .done-card { gap: 10px; }
    .done-card .lc-word { font-size: clamp(30px, 6vmin, 56px); letter-spacing: 2px; color: #5DB534; }

    @media (max-width: 480px) {
      .lc-controls { display: grid; grid-template-columns: 1fr 1fr; }
      .lc-controls .btn { padding: 10px 8px; }
    }

    /* Phones held sideways: picture beside the words so nothing scrolls */
    @media (orientation: landscape) and (max-height: 520px) {
      .learn-wrap { max-width: 860px; }
      .learn-card { flex-direction: row; min-height: 0; gap: 24px; padding: 10px 20px; }
      .lc-emoji { font-size: clamp(80px, 30vh, 150px); }
      .lc-body { flex: 1; }
      .lc-phonics { margin-bottom: 4px; }
      .lc-telugu { margin-bottom: 4px; padding: 2px 14px; }
      .lc-sentence { min-height: 0; }
      .lc-progress { margin: 6px 0 0; }
      .lc-counter { display: none; }
      .lc-controls { margin-top: 8px; }
      .lc-controls .btn { min-height: 40px; padding: 6px 18px; }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="hdr with-sound">
      <h1><em style="color:#E85D75">H</em><em style="color:#F5A623">e</em><em style="color:#7EC850">s</em><em style="color:#4DADEA">h</em><em style="color:#B07CD8">v</em><em style="color:#E85D75">i</em><em style="color:#F5A623">t</em><em style="color:#7EC850">h</em><em style="color:#4DADEA">a</em>'s Learn</h1>
      <p class="sub">Watch, listen, and learn English!</p>
      <button type="button" class="sound-btn" aria-pressed="true" aria-label="Sound is on">🔊</button>
    </header>
    <nav class="nav-links" aria-label="Activities" data-page="learn"></nav>

    <main class="learn-wrap">
      <div class="cat-pills" id="cat-pills" hidden></div>
      <div id="learn-area"></div>
    </main>
  </div>

  <script src="js/common.js?v=15"></script>
  <script src="js/data.js?v=15"></script>
  <script src="js/telugu.js?v=15"></script>
  <script>
    // Deeper than the pastel palette so the big word stays readable on a white card.
    const ACCENT_COLORS = ['#E0506A','#E8961A','#2F9BE0','#5DB534','#A066D3','#F4774E','#1F9488','#A13DB8'];

    const area = document.getElementById('learn-area');
    const pillsContainer = document.getElementById('cat-pills');
    let currentCat = null;
    let currentIdx = 0;
    let autoPlay = false;
    let autoTimer = null;
    let seq = 0;   // bumps whenever narration restarts, so stale callbacks drop out

    function speak(text, rate, onEnd) { Speech.speak(text, rate || 0.75, onEnd); }

    function later(my, ms, fn) { setTimeout(() => { if (my === seq) fn(); }, ms); }

    function stopNarration() {
      seq++;
      clearTimeout(autoTimer);
      autoTimer = null;
      Speech.stop();
    }

    function setAutoPlay(on) {
      autoPlay = on;
      App.keepAwake(on);
      const btn = document.getElementById('lc-play');
      if (btn) {
        btn.innerHTML = on ? '⏸ Pause' : '▶ Auto Play';
        btn.style.background = on ? '#E8961A' : '#5DB534';
        btn.setAttribute('aria-pressed', String(on));
      }
    }

    function speakPhonics(my, word, cb) {
      const letters = word.replace(/[^A-Za-z]/g, '').split('');
      let i = 0;
      function next() {
        if (i >= letters.length) { later(my, 400, () => speak(word, 0.7, () => { if (my === seq) cb(); })); return; }
        speak(letters[i], 0.6, () => { if (my !== seq) return; i++; later(my, 250, next); });
      }
      next();
    }

    function highlightWord(sentence, word) {
      const name = word.replace(/[^A-Za-z ]/g, '');
      return sentence.replace(new RegExp('\\b(' + name + ')\\b', 'gi'), '<span class="highlight">$1</span>');
    }

    function sentencesFor(item) { return SENTENCES[item.id] || ['This is ' + item.name]; }

    function setPills(cat) {
      pillsContainer.hidden = !cat;
      pillsContainer.querySelectorAll('.cat-pill').forEach(p => {
        const on = !!cat && p.dataset.cat === cat.id;
        p.classList.toggle('active', on);
        p.setAttribute('aria-pressed', String(on));
        if (on) App.revealInRow(p, true);
      });
    }

    function startTopic(cat) {
      stopNarration();
      currentCat = cat;
      currentIdx = 0;
      setPills(cat);
      showCard();
    }

    function go(delta) {
      const n = currentIdx + delta;
      if (n < 0) return;
      stopNarration();
      if (n >= currentCat.items.length) { setAutoPlay(false); showComplete(); return; }
      currentIdx = n;
      showCard();
    }

    function showCard() {
      const items = currentCat.items;
      const item = items[currentIdx];
      const color = ACCENT_COLORS[currentIdx % ACCENT_COLORS.length];
      const telugu = TELUGU[item.id] || '';

      area.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'learn-card';
      card.style.setProperty('--accent', color);

      const media = document.createElement('div');
      media.className = 'lc-media';
      const emoji = document.createElement('div');
      emoji.className = 'lc-emoji';
      renderIcon(emoji, item);
      media.appendChild(emoji);

      const body = document.createElement('div');
      body.className = 'lc-body';
      body.innerHTML =
        '<div class="lc-word"></div><div class="lc-phonics" aria-hidden="true"></div>' +
        (telugu ? '<div class="lc-telugu" lang="te"></div>' : '') +
        '<div class="lc-sentence" id="lc-sentence"></div>' +
        (item.q ? '<div class="lc-action" id="lc-action" hidden></div>' : '') +
        '<div class="lc-progress" aria-hidden="true"></div><div class="lc-counter"></div>';
      body.querySelector('.lc-word').textContent = item.name;
      body.querySelector('.lc-phonics').textContent = item.name.split('').join(' · ');
      if (telugu) body.querySelector('.lc-telugu').textContent = telugu;
      body.querySelector('.lc-sentence').innerHTML = highlightWord(sentencesFor(item)[0], item.name);
      if (item.q) body.querySelector('.lc-action').textContent = item.q;
      const dots = body.querySelector('.lc-progress');
      items.forEach((_, i) => {
        const d = document.createElement('span');
        d.className = 'lc-dot' + (i === currentIdx ? ' active' : '') + (i < currentIdx ? ' done' : '');
        dots.appendChild(d);
      });
      body.querySelector('.lc-counter').textContent = (currentIdx + 1) + ' / ' + items.length;

      card.appendChild(media);
      card.appendChild(body);
      area.appendChild(card);
      App.onSwipe(card, { left: () => go(1), right: () => go(-1) });

      const controls = document.createElement('div');
      controls.className = 'lc-controls';
      controls.innerHTML =
        '<button type="button" class="btn" id="lc-prev" style="background:#9A8587">← Back</button>' +
        '<button type="button" class="btn" id="lc-repeat" style="background:#A066D3"><span class="emoji">🔊</span> Say Again</button>' +
        '<button type="button" class="btn" id="lc-play" aria-pressed="false"></button>' +
        '<button type="button" class="btn" id="lc-next" style="background:#2F9BE0"></button>';
      area.appendChild(controls);

      const prev = document.getElementById('lc-prev');
      prev.disabled = currentIdx === 0;
      prev.addEventListener('click', () => { setAutoPlay(false); go(-1); });
      document.getElementById('lc-repeat').addEventListener('click', () => { stopNarration(); playSequence(); });
      document.getElementById('lc-play').addEventListener('click', () => {
        if (autoPlay) { setAutoPlay(false); stopNarration(); }
        else { setAutoPlay(true); stopNarration(); playSequence(); }
      });
      const next = document.getElementById('lc-next');
      next.textContent = currentIdx < items.length - 1 ? 'Next →' : 'Finish 🎉';
      next.addEventListener('click', () => { setAutoPlay(false); go(1); });
      setAutoPlay(autoPlay);

      playSequence();
    }

    function playSequence() {
      const my = ++seq;
      const item = currentCat.items[currentIdx];
      const actionEl = document.getElementById('lc-action');
      if (actionEl) actionEl.hidden = true;

      speak(item.name, 0.65, () => {
        if (my !== seq) return;
        later(my, 400, () => speakPhonics(my, item.name, () => {
          later(my, 500, () => playSentences(my, item, sentencesFor(item), 0));
        }));
      });
    }

    function playSentences(my, item, sentences, idx) {
      if (idx >= sentences.length) {
        const finish = () => { if (autoPlay && my === seq) autoTimer = setTimeout(() => go(1), 2000); };
        if (!item.q) { finish(); return; }
        const actionEl = document.getElementById('lc-action');
        if (actionEl) actionEl.hidden = false;
        later(my, 300, () => speak(item.q, 0.8, () => { if (my === seq) finish(); }));
        return;
      }
      const el = document.getElementById('lc-sentence');
      if (el) el.innerHTML = highlightWord(sentences[idx], item.name);
      speak(sentences[idx], 0.8, () => {
        if (my === seq) later(my, 600, () => playSentences(my, item, sentences, idx + 1));
      });
    }

    function showComplete() {
      area.innerHTML = `
        <div class="learn-card done-card" style="--accent:#5DB534">
          <div class="lc-emoji emoji">🎉</div>
          <div class="lc-word">Well Done!</div>
          <div class="lc-sentence">You learned all the ${currentCat.name}!</div>
          <div class="lc-telugu" lang="te">బాగా చేశావ్!</div>
        </div>
        <div class="lc-controls">
          <button type="button" class="btn" id="lc-again" style="background:#A066D3"><span class="emoji">🔄</span> Learn Again</button>
          <button type="button" class="btn" id="lc-topics" style="background:#2F9BE0"><span class="emoji">📚</span> New Topic</button>
        </div>`;
      document.getElementById('lc-again').addEventListener('click', () => startTopic(currentCat));
      document.getElementById('lc-topics').addEventListener('click', showCatPicker);
      speak('Well done! You learned all the ' + currentCat.name + '!', 0.85);
    }

    function showCatPicker() {
      stopNarration();
      setAutoPlay(false);
      currentCat = null;
      setPills(null);
      area.innerHTML = '<h2 class="learn-title">Pick a topic to learn!</h2>';
      const grid = document.createElement('div');
      grid.className = 'cat-grid';
      CATEGORIES.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cat-btn';
        btn.style.animationDelay = (i * 0.05) + 's';
        btn.innerHTML = '<span class="cat-emoji" aria-hidden="true">' + cat.emoji + '</span><span class="cat-name">' + cat.name + '</span>';
        btn.addEventListener('click', () => startTopic(cat));
        grid.appendChild(btn);
      });
      area.appendChild(grid);
    }

    CATEGORIES.forEach(cat => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'cat-pill';
      pill.dataset.cat = cat.id;
      pill.innerHTML = '<span class="emoji" aria-hidden="true">' + cat.emoji + '</span>' + cat.name;
      pill.addEventListener('click', () => startTopic(cat));
      pillsContainer.appendChild(pill);
    });

    document.addEventListener('keydown', e => {
      if (!currentCat || !document.getElementById('lc-next') || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowRight') { setAutoPlay(false); go(1); }
      else if (e.key === 'ArrowLeft') { setAutoPlay(false); go(-1); }
    });

    // Speech stops when the app is hidden; pick auto play back up on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { seq++; clearTimeout(autoTimer); }
      else if (autoPlay && currentCat && document.getElementById('lc-next')) playSequence();
    });

    showCatPicker();
  </script>
</body>
</html>
