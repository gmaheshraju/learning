  <style>
    .home { max-width: 1040px; margin: 0 auto; }

    /* Greeting */
    .home-top {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
      padding: calc(14px + env(safe-area-inset-top)) 0 18px;
    }
    .hello-bug {
      width: 66px; height: 66px; border: none; padding: 6px; border-radius: 24px; cursor: pointer;
      background: var(--surface); box-shadow: var(--shadow-sm), inset 0 -4px 0 rgba(47,34,53,.06);
    }
    .hello-bug svg { width: 100%; height: 100%; animation: bob 2.6s ease-in-out infinite; }
    .hello-bug.hi svg { animation: wiggle .6s ease; }
    .hello h1 {
      font-family: var(--display); font-weight: 700; font-size: clamp(27px, 4.6vmin, 40px); line-height: 1.05;
      color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hello p { margin-top: 3px; font-size: clamp(15px, 2.1vmin, 19px); font-weight: 800; color: var(--ink-3); }

    /* Sticker book card */
    .stk-card {
      display: flex; align-items: center; gap: 14px; margin: 0 0 22px; padding: 12px 16px 12px 12px;
      border-radius: 26px; text-decoration: none; color: var(--ink); -webkit-touch-callout: none;
      background: linear-gradient(135deg, color-mix(in srgb, #FF6FA9 16%, var(--surface)), var(--surface) 60%);
      background-color: var(--surface); box-shadow: var(--shadow-sm), inset 0 -4px 0 rgba(47,34,53,.05);
      transition: transform .18s var(--spring); animation: bounceIn .5s var(--spring) both;
    }
    .stk-card:active { transform: scale(.97); }
    .stk-art { width: 62px; height: 62px; flex: none; border-radius: 20px; display: grid; place-items: center; background: #FF6FA9; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
    .stk-art svg { width: 48px; height: 48px; }
    .stk-text { flex: 1; min-width: 0; }
    .stk-text b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; }
    .stk-text small { display: block; font-size: 14px; font-weight: 800; color: var(--ink-3); }
    .stk-peek { display: flex; flex: none; font-family: var(--emoji); font-size: 28px; line-height: 1; }
    .stk-peek span { margin-left: -8px; filter: drop-shadow(0 2px 0 var(--surface)); }
    .stk-new { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #FF6B6B; color: #fff; font-size: 12px; font-weight: 900; vertical-align: 2px; }
    @media (max-width: 380px) { .stk-peek span:nth-child(n+4) { display: none; } .stk-peek { font-size: 24px; } .stk-text b { font-size: 18px; } }

    /* Today's adventure: one game to make, one to solve, one for words */
    .adv {
      margin: 0 0 14px; padding: 12px 12px 14px; border-radius: 26px;
      background: linear-gradient(135deg, color-mix(in srgb, #FFC93C 24%, var(--surface)), var(--surface) 70%);
      background-color: var(--surface); box-shadow: var(--shadow-sm), inset 0 -4px 0 rgba(47,34,53,.05);
      animation: bounceIn .5s var(--spring) both;
    }
    .adv-head {
      display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 10px; padding: 0 4px 0 0;
      border: none; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer;
    }
    .adv-ring { position: relative; width: 56px; height: 56px; flex: none; }
    .adv-ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .adv-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
    .adv-ring .track { stroke: color-mix(in srgb, #F5A623 22%, transparent); }
    .adv-ring .fill { stroke: #F5A623; transition: stroke-dashoffset .8s var(--spring); }
    .adv-bug { position: absolute; inset: 8px; }
    .adv-bug svg { width: 100%; height: 100%; }
    .adv-head b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.15; }
    .adv-head small { display: block; font-size: 14px; font-weight: 800; color: var(--ink-3); }
    .adv-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .adv-step {
      --c: var(--accent); position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0;
      padding: 10px 6px 10px; border-radius: 20px; background: var(--surface); color: var(--ink); text-decoration: none;
      box-shadow: var(--shadow-sm); -webkit-touch-callout: none; transition: transform .18s var(--spring);
    }
    .adv-step:active { transform: scale(.94); }
    .adv-kind { font-size: 12px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; color: var(--c); }
    .adv-ic {
      position: relative; width: 58px; height: 58px; border-radius: 30%; display: grid; place-items: center; background-color: var(--c);
      background-image: linear-gradient(155deg, color-mix(in srgb, var(--c) 62%, #fff) 0%, var(--c) 60%);
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35);
    }
    .adv-ic svg { width: 76%; height: 76%; }
    .adv-step b { max-width: 100%; font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.15; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adv-tick {
      position: absolute; top: -8px; right: -10px; width: 28px; height: 28px; border-radius: 50%; display: none; place-items: center;
      background: var(--good); color: #fff; box-shadow: 0 0 0 3px var(--surface), 0 2px 0 3px rgba(0,0,0,.08);
    }
    .adv-tick .ico { width: 17px; height: 17px; stroke-width: 3.4; }
    .adv-step.done .adv-tick { display: grid; }
    .adv-step.done .adv-ic svg { opacity: .6; }
    .adv-step.stamp .adv-tick { animation: stamp .6s var(--spring) .35s both; }
    .adv.all { background-image: linear-gradient(135deg, color-mix(in srgb, #FFC93C 45%, var(--surface)), color-mix(in srgb, #FFC93C 12%, var(--surface)) 70%); }
    @keyframes stamp { 0% { transform: scale(2.4) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(4deg); opacity: 1; } 100% { transform: none; } }
    @media (min-width: 700px) {
      .adv { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); align-items: center; gap: 14px; padding: 14px; }
      .adv-head { margin: 0; }
    }

    .home-foot {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 18px;
      margin: 4px 0 8px; font-size: 13px; font-weight: 800; color: var(--ink-3);
    }
    .home-foot .chip { min-height: 40px; font-size: 15px; }
    .home-foot .chip .ico { width: 20px; height: 20px; }

    /* First run */
    .welcome {
      position: fixed; inset: 0; z-index: 200; overflow-y: auto; overscroll-behavior: contain;
      background:
        radial-gradient(700px 480px at 10% -10%, var(--bg-glow-1) 0%, transparent 65%),
        radial-gradient(700px 520px at 100% 110%, var(--bg-glow-2) 0%, transparent 65%),
        var(--bg);
      padding: calc(20px + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
      display: flex;
    }
    .welcome.bye { animation: fadeBg .3s ease-in reverse forwards; pointer-events: none; }
    .wl-step { width: 100%; max-width: 440px; margin: auto; text-align: center; animation: slideUp .45s ease-out both; }
    .wl-bug { width: 132px; height: 132px; margin: 0 auto 4px; animation: bob 2.4s ease-in-out infinite; }
    .wl-bug svg { width: 100%; height: 100%; }
    .wordmark { font-family: var(--display); font-weight: 700; font-size: clamp(54px, 15vw, 72px); line-height: 1; letter-spacing: 1px; }
    .wordmark span { display: inline-block; animation: bounceIn .6s var(--spring) both; }
    .wl-tag { margin: 8px 0 22px; font-family: var(--display); font-weight: 600; font-size: 19px; color: var(--ink-2); }
    .wl-points { list-style: none; text-align: left; display: grid; gap: 10px; margin: 0 0 26px; }
    .wl-points li {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 20px;
      background: var(--surface); box-shadow: var(--shadow-sm);
      font-size: 16px; font-weight: 800; line-height: 1.35; color: var(--ink);
      animation: slideUp .45s ease-out both;
    }
    .wl-points li small { display: block; font-size: 14px; font-weight: 700; color: var(--ink-3); }
    .wl-points .dot { width: 42px; height: 42px; flex: none; border-radius: 14px; display: grid; place-items: center; color: #fff; }
    .wl-points .dot .ico { width: 22px; height: 22px; stroke-width: 2.6; }
    .welcome .btn { width: 100%; min-height: 60px; font-size: 21px; }
    .wl-h { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 7vw, 34px); margin: 4px 0 18px; }
    .wl-label { display: block; text-align: left; margin: 0 4px 8px; font-size: 15px; font-weight: 900; color: var(--ink-2); }
    .wl-ages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 0 0 10px; }
    .wl-age {
      aspect-ratio: 1; min-height: 48px; border: none; border-radius: 18px; cursor: pointer;
      background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm), inset 0 -4px 0 rgba(47,34,53,.07);
      font-family: var(--display); font-weight: 600; font-size: 24px;
      transition: transform .15s var(--spring), background-color .2s, color .2s;
    }
    .wl-age:active { transform: scale(.9); }
    .wl-age[aria-checked="true"] { background: var(--accent); color: #fff; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), var(--shadow-sm); }
    .wl-note { margin: 0 4px 24px; font-size: 14px; font-weight: 700; color: var(--ink-3); text-align: left; }
    .wl-back { margin-top: 10px; min-height: 44px; border: none; background: none; cursor: pointer; font-weight: 800; font-size: 16px; color: var(--ink-3); }

    @media (orientation: landscape) and (max-height: 520px) {
      .home-top { padding: calc(8px + env(safe-area-inset-top)) 0 10px; }
      .hello-bug { width: 52px; height: 52px; border-radius: 18px; }
      .hello h1 { font-size: 26px; }
      .shelf { margin-bottom: 18px; }
      .wl-step { max-width: 680px; }
      .wl-bug { width: 84px; height: 84px; }
      .wordmark { font-size: 48px; }
      .wl-tag { margin: 4px 0 14px; }
      .wl-points { grid-template-columns: repeat(3, 1fr); margin-bottom: 16px; }
      .wl-points li { flex-direction: column; text-align: center; font-size: 15px; padding: 10px; }
      .wl-h { margin-bottom: 10px; }
    }
    @media (max-width: 360px) {
      .hello-bug { width: 56px; height: 56px; }
      .home-top { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="home-top">
      <button type="button" class="hello-bug" id="bug" aria-label="Say hello"></button>
      <div class="hello">
        <h1 id="hello">Hi there!</h1>
        <p>What shall we play?</p>
      </div>
      <div class="tb-actions">
        <button type="button" class="sound-btn"></button>
        <button type="button" class="ib grown-btn" id="grown" aria-label="For grown-ups (press and hold)"></button>
      </div>
    </header>
    <main class="home" id="shelves"></main>
    <footer class="home-foot" id="foot"></footer>
  </div>

  <div class="welcome" id="welcome" hidden></div>

  <script src="js/common.js?v=20"></script>
  <script>
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
    };
    var shelves = document.getElementById('shelves');
    var bug = document.getElementById('bug');
    bug.innerHTML = App.MASCOT;
    document.getElementById('grown').innerHTML = App.icon('grown');
    App.holdButton(document.getElementById('grown'), function () { location.href = 'parents.html'; });

    // Games that suit the child's age; a grown-up can show them all.
    function suits(a, age) {
      if (a.section === 'grown') return false;
      if (!age || store.get('heshvi-showall') === '1') return true;
      return a.min <= age && age <= a.max + 1;
    }

    function greeting() {
      var name = App.getName();
      return name ? 'Hi, ' + name + '!' : 'Hi there!';
    }

    function renderStickers() {
      var book = App.stickerBook(), have = App.STICKERS.filter(function (e) { return book.own[e]; });
      var card = document.createElement('a');
      card.className = 'stk-card';
      card.href = 'stickers.html';
      card.innerHTML = '<span class="stk-art">' + App.art('stickers') + '</span><span class="stk-text"><b>My stickers' +
        (book.unseen ? '<span class="stk-new">' + book.unseen + ' new</span>' : '') + '</b><small>' +
        (have.length ? have.length + ' of ' + App.STICKERS.length + ' collected' : 'Win games to collect stickers!') + '</small></span>' +
        '<span class="stk-peek" aria-hidden="true">' + have.slice(-4).reverse().map(function (e) { return '<span>' + e + '</span>'; }).join('') + '</span>';
      card.addEventListener('click', function () { App.sfx('pop'); });
      shelves.appendChild(card);
    }

    /* ---------- Today's adventure ----------
       Three games a day, one from each shelf, different every day. A game counts
       once a round is finished today, or after a minute of free play. Finishing
       all three earns a party and a sticker. */
    var ADV_KEY = 'heshvi-adventure';
    var ADV_KINDS = [['create', 'Make'], ['think', 'Solve'], ['words', 'Learn']];
    function adventure() {
      var day = App.dayKey(), a = null;
      try { a = JSON.parse(store.get(ADV_KEY) || 'null'); } catch (e) { a = null; }
      if (a && a.day === day && a.picks && a.picks.every(App.activity)) return a;
      var age = App.getAge(), dayNo = Math.floor(Date.now() / 86400000);
      var picks = ADV_KINDS.map(function (k, i) {
        var list = App.ACTIVITIES.filter(function (x) { return x.section === k[0] && suits(x, age); });
        return list.length ? list[(dayNo * 7 + i * 3) % list.length].id : null;
      }).filter(Boolean);
      a = { day: day, picks: picks, seenIds: [], prize: false };
      store.set(ADV_KEY, JSON.stringify(a));
      return a;
    }
    function advDone(id) {
      var day = App.dayKey(), st = App.stats(id), secs = ((App.playTime()[day] || {})[id]) || 0;
      return ((st.days || {})[day] || 0) > 0 || secs >= (App.activity(id).section === 'think' ? 120 : 60);
    }
    function renderAdventure() {
      var a = adventure(), done = a.picks.map(advDone), n = done.filter(Boolean).length, total = a.picks.length;
      if (!total) return;
      var seen = a.seenIds || [];
      var fresh = a.picks.filter(function (id, i) { return done[i] && seen.indexOf(id) === -1; });   // done since the last visit
      var box = document.createElement('section');
      box.className = 'adv' + (n === total ? ' all' : '');
      box.setAttribute('aria-label', 'Today\u2019s adventure');
      var C = 2 * Math.PI * 24;
      box.innerHTML = '<button type="button" class="adv-head"><span class="adv-ring"><svg viewBox="0 0 56 56" aria-hidden="true">' +
        '<circle class="track" cx="28" cy="28" r="24"/><circle class="fill" cx="28" cy="28" r="24" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/></svg>' +
        '<span class="adv-bug">' + App.MASCOT + '</span></span><span><b>Today\u2019s adventure</b><small>' +
        (n === total ? 'All done! See you tomorrow' : n + ' of ' + total + ' done') + '</small></span></button><div class="adv-steps"></div>';
      var steps = box.querySelector('.adv-steps');
      a.picks.forEach(function (id, i) {
        var act = App.activity(id), kind = ADV_KINDS.filter(function (k) { return k[0] === act.section; })[0];
        var t = document.createElement('a');
        t.className = 'adv-step' + (done[i] ? ' done' : '') + (fresh.indexOf(id) !== -1 ? ' stamp' : '');
        t.href = act.file;
        t.style.setProperty('--c', act.color);
        t.setAttribute('aria-label', kind[1] + ': ' + act.name + (done[i] ? ', done' : ''));
        t.innerHTML = '<span class="adv-kind">' + kind[1] + '</span><span class="adv-ic">' + act.art +
          '<span class="adv-tick" aria-hidden="true">' + App.icon('check') + '</span></span><b>' + act.short + '</b>';
        t.addEventListener('click', function () { App.sfx('pop'); });
        steps.appendChild(t);
      });
      box.querySelector('.adv-head').addEventListener('click', function () {
        App.bujji('happy');
        App.sfx('pop');
        Speech.speak(n === total ? 'You finished today\u2019s adventure! See you tomorrow!' :
          n ? 'Keep going! ' + ['', 'Two more to go!', 'One more to go!'][n] : 'Today\u2019s adventure! Make something, solve something, and learn something new!', 0.9);
      });
      shelves.appendChild(box);
      // fill the ring after the card is in, so it sweeps round
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        box.querySelector('.fill').setAttribute('stroke-dashoffset', String(C * (1 - n / total)));
      }); });
      if (fresh.length) { a.seenIds = seen.concat(fresh); setTimeout(function () { App.sfx('yay'); }, 450); }
      if (n === total && !a.prize) {
        a.prize = true;
        setTimeout(function () {
          App.celebrate({
            title: 'Adventure done!', stars: 3, say: 'You finished today\u2019s adventure! You made, you solved and you learned!',
            text: 'Come back tomorrow for a new adventure.',
            buttons: [{ label: 'Yay!', icon: 'star', onClick: function () { render(); } }]
          });
        }, 1100);
      }
      store.set(ADV_KEY, JSON.stringify(a));
    }

    function render() {
      var age = App.getAge();
      document.getElementById('hello').textContent = greeting();
      shelves.innerHTML = '';
      renderAdventure();
      renderStickers();
      var n = 0;
      App.SECTIONS.forEach(function (sec) {
        var items = App.ACTIVITIES.filter(function (a) { return a.section === sec.id && suits(a, age); });
        if (!items.length) return;
        var el = document.createElement('section');
        el.className = 'shelf';
        el.style.setProperty('--c', sec.color);
        el.setAttribute('aria-label', sec.name);
        el.innerHTML = '<h2 class="shelf-head">' + sec.name + '</h2><div class="apps"></div>';
        var grid = el.querySelector('.apps');
        items.forEach(function (a) {
          var t = document.createElement('a');
          t.className = 'app';
          t.href = a.file;
          t.style.setProperty('--c', a.color);
          t.style.animationDelay = Math.min(n++ * 0.035, 0.6) + 's';
          t.innerHTML = '<span class="app-icon">' + a.art + '</span><span class="app-name">' + a.name + '</span>';
          t.addEventListener('click', function () { App.sfx('pop'); });
          grid.appendChild(t);
        });
        shelves.appendChild(el);
      });
    }

    var HELLOS = ['I am Bujji! Let\u2019s play!', 'Pick a game!', 'I love colours!', 'You can do it!', 'What shall we make today?', 'Hee hee! That tickles!',
      // wonder questions to talk about together
      'Why do you think the sky is blue?', 'Where do you think the rain comes from?', 'How many colours can you see around you?',
      'What is your favourite animal? Why?', 'Can you find something round near you?', 'What do you think birds dream about?'];
    bug.addEventListener('click', function () {
      bug.classList.remove('hi');
      void bug.offsetWidth;
      bug.classList.add('hi');
      App.sfx('pop');
      var name = App.getName();
      App.bujji('giggle');
      Speech.speak((name ? 'Hi ' + name + '! ' : 'Hi! ') + HELLOS[Math.floor(Math.random() * HELLOS.length)], 0.9);
    });

    /* ---------- Getting the app ---------- */
    function installSheet() {
      var ios = App.platform() === 'ios';
      var steps = ios
        ? '<ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap <b>Share</b> ' + App.icon('share') + ' (on newer iPhones it is inside the <b>\u2022\u2022\u2022</b> menu).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>'
        : '<ol class="steps"><li>Open the browser menu <b>⋮</b></li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>';
      App.sheet({
        title: 'Add Heshvi to your home screen', kicker: 'Get the app',
        body: '<div class="sheet-sec"><p>It opens full screen like an app, and works with no internet: in the car, on a plane, anywhere.</p></div>' +
          '<div class="sheet-sec">' + steps + '</div>'
      });
    }
    function renderFoot() {
      var foot = document.getElementById('foot');
      foot.innerHTML = '';
      if (!App.isStandalone() && (App.canInstall() || App.platform() !== 'desktop')) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.innerHTML = App.icon('install') + 'Get the app';
        b.addEventListener('click', function () { if (!App.promptInstall()) installSheet(); });
        foot.appendChild(b);
      }
      var note = document.createElement('span');
      note.textContent = 'No ads · No sign-up · Works offline';
      foot.appendChild(note);
    }
    document.addEventListener('heshvi:installable', renderFoot);
    document.addEventListener('heshvi:installed', renderFoot);

    /* ---------- First run: say hello, then who's playing ---------- */
    var welcome = document.getElementById('welcome');
    var LETTERS = [['H', '#FF6B6B'], ['e', '#FF9F43'], ['s', '#F7B500'], ['h', '#2FBF71'], ['v', '#3FB2FF'], ['i', '#8C6CFF']];

    function stepHello() {
      welcome.innerHTML =
        '<div class="wl-step">' +
          '<div class="wl-bug">' + App.MASCOT + '</div>' +
          '<div class="wordmark" aria-label="Heshvi">' + LETTERS.map(function (l, i) {
            return '<span style="color:' + l[1] + ';animation-delay:' + (0.08 + i * 0.06) + 's" aria-hidden="true">' + l[0] + '</span>';
          }).join('') + '</div>' +
          '<p class="wl-tag">Play, make and learn · ages 2 to 7</p>' +
          '<ul class="wl-points">' +
            point('#FF6B6B', 'volume', 'Made for little hands', 'Big buttons, and every game talks. No reading needed.', 0.3) +
            point('#4A78FF', 'sparkle', 'Grows with your child', 'Art, music, puzzles, patterns, mazes, coding and stories.', 0.38) +
            point('#2FBF71', 'lock', 'Calm and private', 'No ads, no sign-up, nothing to buy. Works offline.', 0.46) +
          '</ul>' +
          '<button type="button" class="btn" id="wl-go" style="--b:#FF6B6B">Let’s begin ' + App.icon('next') + '</button>' +
        '</div>';
      document.getElementById('wl-go').addEventListener('click', function () {
        App.sfx('pop');
        stepWho();
        Speech.speak('Hi! I am Bujji! Who is playing today?', 0.9);
      });
    }
    function point(color, ic, title, text, delay) {
      return '<li style="animation-delay:' + delay + 's"><span class="dot" style="background:' + color + '">' + App.icon(ic) + '</span>' +
        '<span>' + title + '<small>' + text + '</small></span></li>';
    }

    function stepWho() {
      var age = App.getAge();
      welcome.innerHTML =
        '<div class="wl-step">' +
          '<div class="wl-bug" style="width:96px;height:96px">' + App.MASCOT + '</div>' +
          '<h2 class="wl-h">Who’s playing?</h2>' +
          '<label class="wl-label" for="wl-name">Child’s first name <span style="font-weight:700;color:var(--ink-3)">(optional)</span></label>' +
          '<input class="field" id="wl-name" type="text" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="e.g. Heshvi" style="margin-bottom:18px">' +
          '<span class="wl-label" id="wl-age-l">How old?</span>' +
          '<div class="wl-ages" role="radiogroup" aria-labelledby="wl-age-l">' + [2, 3, 4, 5, 6, 7].map(function (a) {
            return '<button type="button" class="wl-age" role="radio" data-age="' + a + '" aria-checked="' + (a === age) + '" aria-label="' +
              (a === 7 ? '7 or older' : a + ' years old') + '">' + (a === 7 ? '7+' : a) + '</button>';
          }).join('') + '</div>' +
          '<p class="wl-note">Games start at the right level for this age. Saved only on this device.</p>' +
          '<button type="button" class="btn" id="wl-start" style="--b:#2FBF71"' + (age ? '' : ' disabled') + '>Start playing ' + App.icon('play') + '</button>' +
          '<button type="button" class="wl-back" id="wl-back">Back</button>' +
        '</div>';
      var nameEl = document.getElementById('wl-name');
      nameEl.value = App.getName();
      var start = document.getElementById('wl-start');
      nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') nameEl.blur(); });
      welcome.querySelectorAll('.wl-age').forEach(function (b) {
        b.addEventListener('click', function () {
          age = +b.getAttribute('data-age');
          welcome.querySelectorAll('.wl-age').forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); });
          start.disabled = false;
          App.sfx('pop');
        });
      });
      document.getElementById('wl-back').addEventListener('click', stepHello);
      start.addEventListener('click', function () {
        App.setName(nameEl.value.replace(/\s+/g, ' '));
        App.setAge(age);
        store.set('heshvi-onboarded', '1');
        render();
        welcome.classList.add('bye');
        setTimeout(function () { welcome.hidden = true; welcome.innerHTML = ''; welcome.classList.remove('bye'); }, 300);
        App.sfx('yay');
        App.confetti(40);
        Speech.speak(greeting().replace('!', '') + '! What shall we play?', 0.9);
      });
    }

    render();
    renderFoot();
    if (store.get('heshvi-onboarded') !== '1' || /[?&]welcome\b/.test(location.search)) {
      welcome.hidden = false;
      stepHello();
    }
    // Returning from the Parents area or another tab: pick up name, age and settings.
    window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
  </script>
</body>
</html>
