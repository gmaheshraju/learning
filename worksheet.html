<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheets — Heshvitha's Learning World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    .ws-wrap { max-width: 900px; margin: 0 auto; padding: 20px 12px; }
    .ws-intro { text-align: center; margin-bottom: 16px; animation: slideUp .5s ease-out; }
    .ws-intro p { font-size: 13px; color: var(--textL); margin-top: 4px; line-height: 1.5; }

    .ws-btn {
      display: inline-block; color: #fff;
      border: none; border-radius: 50px; padding: 10px 28px;
      font-size: 15px; font-weight: 800; cursor: pointer;
      margin: 6px 4px; transition: transform .15s;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }
    .ws-btn:hover { transform: scale(1.06); }
    .ws-btn:active { transform: scale(.95); }

    .cat-pills {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      margin-bottom: 16px; animation: slideUp .5s .04s both;
    }
    .cat-pill {
      padding: 6px 14px; border-radius: 20px; border: 2px solid var(--sh);
      background: var(--card); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all .2s; color: var(--text);
    }
    .cat-pill:hover, .cat-pill.active { border-color: #F5A623; background: #FFF7EA; }
    .cat-pill.active { font-weight: 900; }

    .ws-page {
      width: 100%; margin: 0 auto 20px;
      border: 2px dashed var(--sh); border-radius: 16px;
      padding: 8px 10px; background: var(--card);
    }
    .ws-page-title {
      text-align: center; font-size: 15px; font-weight: 900;
      margin-bottom: 1px; color: var(--text);
    }
    .ws-page-mode {
      text-align: center; margin-bottom: 4px;
    }
    .ws-page-mode span {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 2px; padding: 2px 10px; border-radius: 20px;
    }

    .ws-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
    }

    .ws-quad {
      border: 2px solid var(--sh); border-radius: 10px;
      padding: 6px 6px; background: #fff;
    }
    .ws-quad-title {
      text-align: center; font-size: 10px; font-weight: 800;
      color: var(--textL); text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .ws-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 3px;
    }
    .ws-row:last-child { margin-bottom: 0; }

    .ws-cell {
      width: 42%; display: flex; align-items: center; justify-content: center;
      border: 2px solid; border-radius: 8px;
      padding: 3px 3px; min-height: 36px;
    }
    .ws-dots {
      flex: 1; border-bottom: 2px dotted #ccc; margin: 0 3px;
      align-self: center; min-width: 12px;
    }

    .ws-emoji { font-size: 24px; line-height: 1; }
    .ws-word {
      font-size: 13px; font-weight: 900; letter-spacing: 1px;
      text-align: center; line-height: 1.1;
    }
    .ws-word.ws-long { font-size: 10px; letter-spacing: 0.5px; }
    .ws-spell {
      font-size: 6px; font-weight: 700; letter-spacing: 1px;
      opacity: .6; margin-top: 1px; text-align: center;
    }

    .ws-footer {
      text-align: center; margin-top: 4px; font-size: 8px;
      color: var(--textL); font-weight: 600;
    }

    @media print {
      html, body { height: 100%; background: #fff !important; padding: 0; margin: 0; }
      .nav-links, .ws-btn, .ws-intro, .cat-pills, .hdr { display: none !important; }
      .gw { padding: 0; max-width: 100%; display: block; min-height: auto; }
      .ws-wrap { padding: 0; max-width: 100%; }
      .ws-page {
        border: none; border-radius: 0;
        padding: 16px 24px 12px;
        box-shadow: none; max-width: 100%;
        page-break-inside: avoid;
        page-break-after: always;
        margin: 0;
      }
      .ws-page:last-child { page-break-after: auto; }
      .ws-page-title { font-size: 16px; margin-bottom: 2px; }
      .ws-page-mode { margin-bottom: 6px; }
      .ws-grid {
        gap: 40px 30px;
      }
      .ws-quad {
        box-shadow: none;
        padding: 8px 10px;
      }
      .ws-quad-title { font-size: 11px; margin-bottom: 5px; }
      .ws-row { margin-bottom: 5px; }
      .ws-emoji { font-size: 28px; }
      .ws-cell { min-height: 38px; padding: 4px; border-radius: 8px; }
      .ws-dots { margin: 0 4px; }
      .ws-footer { margin-top: 6px; font-size: 8px; }
      .ws-word { font-size: 13px; }
      .ws-word.ws-long { font-size: 10px; }
      .ws-spell { font-size: 6px; }
    }

    @media (max-width: 500px) {
      .ws-grid { grid-template-columns: 1fr; }
      .ws-emoji { font-size: 28px; }
      .ws-word { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="gw">
    <div class="hdr">
      <h1>
        <em style="color:#E85D75">H</em><em style="color:#F5A623">e</em><em style="color:#7EC850">s</em><em style="color:#4DADEA">h</em><em style="color:#B07CD8">v</em><em style="color:#E85D75">i</em><em style="color:#F5A623">t</em><em style="color:#7EC850">h</em><em style="color:#4DADEA">a</em>'s Worksheets
      </h1>
      <div class="sub">Print and draw lines to match!</div>
    </div>
    <nav class="nav-links">
      <a href="index.html">Match</a>
      <a href="learn.html">Learn</a>
      <a href="find.html">Find It!</a>
      <a href="worksheet.html" class="active">Worksheets</a>
    </nav>

    <div class="ws-wrap">
      <div class="ws-intro">
        <p>4 mini worksheets per page — print front (Easy) and back (Hard)!<br>
        Each box has 4 items to match by drawing lines.</p>
        <button class="ws-btn" style="background:#4DADEA" onclick="window.print()">🖨️ Print Worksheets</button>
      </div>

      <div class="cat-pills" id="cat-pills"></div>
      <div id="ws-pages"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/fruits_vegs.js"></script>
  <script src="js/kitchen_house.js"></script>
  <script src="js/vehicles_colors.js"></script>
  <script>
    const WS_COLORS = ['#E85D75','#F5A623','#4DADEA','#7EC850'];
    const WS_BGS = ['#FFF0F2','#FFF7EA','#EBF5FF','#F0FAE8'];
    const QUAD_SIZE = 4;
    const QUADS_PER_PAGE = 4;

    const pillsContainer = document.getElementById('cat-pills');
    const pagesContainer = document.getElementById('ws-pages');
    let activePill = null;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildQuad(items, mode, quadNum) {
      const quad = document.createElement('div');
      quad.className = 'ws-quad';

      const title = document.createElement('div');
      title.className = 'ws-quad-title';
      title.textContent = 'Set ' + quadNum;
      quad.appendChild(title);

      const shuffled = shuffle([...items]);

      items.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'ws-row';

        const leftCell = document.createElement('div');
        leftCell.className = 'ws-cell';
        leftCell.style.borderColor = WS_COLORS[i];
        leftCell.style.background = WS_BGS[i];
        const leftEmoji = document.createElement('div');
        leftEmoji.className = 'ws-emoji';
        leftEmoji.textContent = item.icon;
        leftCell.appendChild(leftEmoji);

        const dots = document.createElement('div');
        dots.className = 'ws-dots';

        const rightItem = shuffled[i];
        const rightOrigIdx = items.indexOf(rightItem);
        const rightCell = document.createElement('div');
        rightCell.className = 'ws-cell';
        rightCell.style.borderColor = WS_COLORS[rightOrigIdx];
        rightCell.style.background = WS_BGS[rightOrigIdx];

        if (mode === 'easy') {
          const rightEmoji = document.createElement('div');
          rightEmoji.className = 'ws-emoji';
          rightEmoji.textContent = rightItem.icon;
          rightCell.appendChild(rightEmoji);
        } else {
          const wordWrap = document.createElement('div');
          const wl = document.createElement('div');
          wl.className = 'ws-word' + (rightItem.name.length > 6 ? ' ws-long' : '');
          wl.textContent = rightItem.name;
          wl.style.color = WS_COLORS[i];
          const sp = document.createElement('div');
          sp.className = 'ws-spell';
          sp.textContent = rightItem.name.split('').join(' · ');
          sp.style.color = WS_COLORS[i];
          wordWrap.appendChild(wl);
          wordWrap.appendChild(sp);
          rightCell.appendChild(wordWrap);
        }

        row.appendChild(leftCell);
        row.appendChild(dots);
        row.appendChild(rightCell);
        quad.appendChild(row);
      });

      return quad;
    }

    function buildPage(quads, mode, catName, pageNum, totalPages) {
      const page = document.createElement('div');
      page.className = 'ws-page';

      const title = document.createElement('div');
      title.className = 'ws-page-title';
      title.textContent = catName + ' — Match Worksheet';
      page.appendChild(title);

      const modeWrap = document.createElement('div');
      modeWrap.className = 'ws-page-mode';
      const modeLabel = document.createElement('span');
      if (mode === 'easy') {
        modeLabel.textContent = '🖼️ Easy — Match Pictures';
        modeLabel.style.background = '#E8F5E9';
        modeLabel.style.color = '#2E7D32';
      } else {
        modeLabel.textContent = '🔤 Hard — Match Words';
        modeLabel.style.background = '#FFEBEE';
        modeLabel.style.color = '#C62828';
      }
      modeWrap.appendChild(modeLabel);
      page.appendChild(modeWrap);

      const grid = document.createElement('div');
      grid.className = 'ws-grid';

      quads.forEach((chunk, i) => {
        grid.appendChild(buildQuad(chunk, mode, i + 1));
      });

      page.appendChild(grid);

      const footer = document.createElement('div');
      footer.className = 'ws-footer';
      footer.textContent = 'heshvi.curiousengineers.in · ' + catName + ' · Page ' + pageNum + '/' + totalPages;
      page.appendChild(footer);

      return page;
    }

    function renderWorksheets(cat) {
      pagesContainer.innerHTML = '';
      const items = cat.items;

      const chunks = [];
      for (let i = 0; i < items.length; i += QUAD_SIZE) {
        chunks.push(items.slice(i, i + QUAD_SIZE));
      }

      const pageGroups = [];
      for (let i = 0; i < chunks.length; i += QUADS_PER_PAGE) {
        pageGroups.push(chunks.slice(i, i + QUADS_PER_PAGE));
      }

      const totalPages = pageGroups.length * 2;
      let pageNum = 0;

      pageGroups.forEach(group => {
        pageNum++;
        pagesContainer.appendChild(buildPage(group, 'easy', cat.emoji + ' ' + cat.name, pageNum, totalPages));
        pageNum++;
        pagesContainer.appendChild(buildPage(group, 'hard', cat.emoji + ' ' + cat.name, pageNum, totalPages));
      });
    }

    CATEGORIES.forEach((cat, i) => {
      const pill = document.createElement('button');
      pill.className = 'cat-pill' + (i === 0 ? ' active' : '');
      pill.textContent = cat.emoji + ' ' + cat.name;
      pill.addEventListener('click', () => {
        if (activePill) activePill.classList.remove('active');
        pill.classList.add('active');
        activePill = pill;
        renderWorksheets(cat);
      });
      pillsContainer.appendChild(pill);
      if (i === 0) { activePill = pill; renderWorksheets(cat); }
    });
  </script>
</body>
</html>
