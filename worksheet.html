<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Worksheets — Heshvitha's Learning World</title>
  <meta name="description" content="Playful learning for little ones: match, listen, discover, trace and read along, with Telugu hints.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFBF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1A2A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heshvi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=15">
  <style>
    .ws-wrap { max-width: 900px; margin: 0 auto; }
    .ws-intro { text-align: center; margin-bottom: 14px; animation: slideUp .5s ease-out; }
    .ws-intro p { font-size: clamp(14px, 1.8vmin, 17px); color: var(--textL); font-weight: 600; line-height: 1.5; margin-bottom: 10px; }

    .ws-page {
      width: 100%; margin: 0 auto 20px;
      border: 2px dashed var(--line); border-radius: 16px;
      padding: 10px 12px; background: var(--card);
    }
    .ws-page-title { text-align: center; font-size: 16px; font-weight: 900; margin-bottom: 2px; color: var(--text); }
    .ws-page-mode { text-align: center; margin-bottom: 6px; }
    .ws-page-mode span {
      font-size: 10px; font-weight: 900; text-transform: uppercase;
      letter-spacing: 2px; padding: 2px 10px; border-radius: 20px;
    }

    .ws-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
    .ws-quad { border: 2px solid var(--line); border-radius: 10px; padding: 6px; background: var(--card); }
    .ws-quad-title {
      text-align: center; font-size: 11px; font-weight: 900;
      color: var(--textL); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
    }

    .ws-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .ws-row:last-child { margin-bottom: 0; }
    .ws-cell {
      width: 42%; display: flex; align-items: center; justify-content: center;
      border: 2px solid; border-radius: 8px; padding: 3px; min-height: 40px;
    }
    .ws-dots { flex: 1; border-bottom: 2px dotted var(--line); margin: 0 4px; align-self: center; min-width: 12px; }

    .ws-emoji { font-size: 26px; }
    .ws-word { font-size: 14px; font-weight: 900; letter-spacing: 1px; text-align: center; line-height: 1.1; }
    .ws-word.ws-long { font-size: 11px; letter-spacing: .5px; }
    .ws-spell { font-size: 7px; font-weight: 800; letter-spacing: 1px; opacity: .7; margin-top: 1px; text-align: center; }

    .ws-footer { text-align: center; margin-top: 6px; font-size: 9px; color: var(--textL); font-weight: 700; }

    @media (max-width: 560px) {
      .ws-grid { grid-template-columns: 1fr; grid-template-rows: none; }
      .ws-emoji { font-size: 30px; }
      .ws-word { font-size: 15px; }
    }

    @media print {
      html, body { height: 100%; margin: 0; }
      .ws-intro, .cat-pills, .hdr { display: none !important; }
      .gw { padding: 0; max-width: 100%; }
      .ws-wrap { max-width: 100%; }
      .ws-page {
        border: none; border-radius: 0; padding: 16px 24px 12px; margin: 0;
        background: #fff; break-inside: avoid; break-after: page;
      }
      .ws-page:last-child { break-after: auto; }
      .ws-page-title { font-size: 16px; }
      .ws-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 40px 30px; }
      .ws-quad { background: #fff; padding: 8px 10px; }
      .ws-quad-title { font-size: 11px; margin-bottom: 5px; }
      .ws-row { margin-bottom: 5px; }
      .ws-emoji { font-size: 28px; }
      .ws-cell { min-height: 38px; padding: 4px; }
      .ws-dots { border-bottom-color: #bbb; }
      .ws-word { font-size: 13px; }
      .ws-word.ws-long { font-size: 10px; }
      .ws-spell { font-size: 6px; }
      .ws-footer { font-size: 8px; }
    }
  </style>
</head>
<body>
  <div class="gw">
    <header class="hdr">
      <h1><em style="color:#E85D75">H</em><em style="color:#F5A623">e</em><em style="color:#7EC850">s</em><em style="color:#4DADEA">h</em><em style="color:#B07CD8">v</em><em style="color:#E85D75">i</em><em style="color:#F5A623">t</em><em style="color:#7EC850">h</em><em style="color:#4DADEA">a</em>'s Worksheets</h1>
      <p class="sub">Print and draw lines to match!</p>
    </header>
    <nav class="nav-links" aria-label="Activities" data-page="worksheet"></nav>

    <main class="ws-wrap">
      <div class="ws-intro">
        <p>4 mini worksheets per page — print the front (Easy) and back (Hard)!<br>
        Each box has 4 things to match by drawing lines.</p>
        <button type="button" class="btn" style="background:#2F9BE0" onclick="window.print()"><span class="emoji">🖨️</span> Print Worksheets</button>
      </div>

      <div class="cat-pills" id="cat-pills"></div>
      <div id="ws-pages"></div>
    </main>
  </div>

  <script src="js/common.js?v=15"></script>
  <script src="js/data.js?v=15"></script>
  <script>
    const WS_COLORS = ['#E85D75','#F5A623','#4DADEA','#7EC850'];
    const WS_BGS = ['#FFF0F2','#FFF7EA','#EBF5FF','#F0FAE8'];
    const QUAD_SIZE = 4;
    const QUADS_PER_PAGE = 4;

    const pillsContainer = document.getElementById('cat-pills');
    const pagesContainer = document.getElementById('ws-pages');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildQuad(items, mode, quadNum) {
      const quad = document.createElement('div');
      quad.className = 'ws-quad';

      const title = document.createElement('div');
      title.className = 'ws-quad-title';
      title.textContent = 'Set ' + quadNum;
      quad.appendChild(title);

      const shuffled = shuffle([...items]);

      items.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'ws-row';

        const leftCell = document.createElement('div');
        leftCell.className = 'ws-cell';
        leftCell.style.borderColor = WS_COLORS[i];
        leftCell.style.background = WS_BGS[i];
        const leftEmoji = document.createElement('div');
        leftEmoji.className = 'ws-emoji';
        renderIcon(leftEmoji, item);
        leftCell.appendChild(leftEmoji);

        const dots = document.createElement('div');
        dots.className = 'ws-dots';

        const rightItem = shuffled[i];
        const rightOrigIdx = items.indexOf(rightItem);
        const rightCell = document.createElement('div');
        rightCell.className = 'ws-cell';
        rightCell.style.borderColor = WS_COLORS[rightOrigIdx];
        rightCell.style.background = WS_BGS[rightOrigIdx];

        if (mode === 'easy') {
          const rightEmoji = document.createElement('div');
          rightEmoji.className = 'ws-emoji';
          renderIcon(rightEmoji, rightItem);
          rightCell.appendChild(rightEmoji);
        } else {
          const wordWrap = document.createElement('div');
          const wl = document.createElement('div');
          wl.className = 'ws-word' + (rightItem.name.length > 6 ? ' ws-long' : '');
          wl.textContent = rightItem.name;
          wl.style.color = WS_COLORS[rightOrigIdx];
          const sp = document.createElement('div');
          sp.className = 'ws-spell';
          sp.textContent = rightItem.name.split('').join(' · ');
          sp.style.color = WS_COLORS[rightOrigIdx];
          wordWrap.appendChild(wl);
          wordWrap.appendChild(sp);
          rightCell.appendChild(wordWrap);
        }

        row.appendChild(leftCell);
        row.appendChild(dots);
        row.appendChild(rightCell);
        quad.appendChild(row);
      });

      return quad;
    }

    function buildPage(quads, mode, catName, pageNum, totalPages) {
      const page = document.createElement('div');
      page.className = 'ws-page';

      const title = document.createElement('div');
      title.className = 'ws-page-title';
      title.textContent = catName + ' — Match Worksheet';
      page.appendChild(title);

      const modeWrap = document.createElement('div');
      modeWrap.className = 'ws-page-mode';
      const modeLabel = document.createElement('span');
      if (mode === 'easy') {
        modeLabel.textContent = '🖼️ Easy — Match Pictures';
        modeLabel.style.background = '#E8F5E9';
        modeLabel.style.color = '#2E7D32';
      } else {
        modeLabel.textContent = '🔤 Hard — Match Words';
        modeLabel.style.background = '#FFEBEE';
        modeLabel.style.color = '#C62828';
      }
      modeWrap.appendChild(modeLabel);
      page.appendChild(modeWrap);

      const grid = document.createElement('div');
      grid.className = 'ws-grid';

      quads.forEach((chunk, i) => {
        grid.appendChild(buildQuad(chunk, mode, i + 1));
      });

      page.appendChild(grid);

      const footer = document.createElement('div');
      footer.className = 'ws-footer';
      footer.textContent = 'heshvi.curiousengineers.in · ' + catName + ' · Page ' + pageNum + '/' + totalPages;
      page.appendChild(footer);

      return page;
    }

    function renderWorksheets(cat) {
      pagesContainer.innerHTML = '';
      const items = cat.items;

      const chunks = [];
      for (let i = 0; i < items.length; i += QUAD_SIZE) {
        chunks.push(items.slice(i, i + QUAD_SIZE));
      }

      const pageGroups = [];
      for (let i = 0; i < chunks.length; i += QUADS_PER_PAGE) {
        pageGroups.push(chunks.slice(i, i + QUADS_PER_PAGE));
      }

      const totalPages = pageGroups.length * 2;
      let pageNum = 0;

      pageGroups.forEach(group => {
        pageNum++;
        pagesContainer.appendChild(buildPage(group, 'easy', cat.emoji + ' ' + cat.name, pageNum, totalPages));
        pageNum++;
        pagesContainer.appendChild(buildPage(group, 'hard', cat.emoji + ' ' + cat.name, pageNum, totalPages));
      });
    }

    CATEGORIES.forEach((cat, i) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'cat-pill';
      pill.innerHTML = '<span class="emoji" aria-hidden="true">' + cat.emoji + '</span>' + cat.name;
      pill.addEventListener('click', () => {
        pillsContainer.querySelectorAll('.cat-pill').forEach(p => { p.classList.remove('active'); p.setAttribute('aria-pressed', 'false'); });
        pill.classList.add('active');
        pill.setAttribute('aria-pressed', 'true');
        App.revealInRow(pill, true);
        renderWorksheets(cat);
      });
      pillsContainer.appendChild(pill);
      if (i === 0) { pill.classList.add('active'); pill.setAttribute('aria-pressed', 'true'); renderWorksheets(cat); }
    });
  </script>
</body>
</html>
